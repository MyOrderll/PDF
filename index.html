<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع تعديل الصور</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700&family=Amiri:wght@400;700&family=Cairo:wght@400;700&family=Changa:wght@400;700&family=El+Messiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;700&family=Montserrat:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&family=Playfair+Display:wght@400;700&family=Roboto+Slab:wght@400;700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <!-- مكتبة Tailwind للتصميم السريع -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- مكتبة Fabric.js للتعامل مع الصور والرسم -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <style>
        :root {
            color-scheme: light;
            --page: #eaf0f7;
            --surface: #ffffff;
            --surface-muted: #f2f6fb;
            --ink: #172b43;
            --muted: #5d7189;
            --line: #d3dfeb;
            --brand: #087f96;
            --brand-hover: #07647e;
            --accent: #ee7259;
            --stage: #e4edf7;
            --shadow: 0 20px 48px rgba(24, 48, 72, 0.13);
            --brand-wash: #e6f4f7;
            --blue-wash: #e9effb;
            --green-wash: #eaf5ed;
            --orange-wash: #fff2e6;
        }

        html.dark {
            color-scheme: dark;
            --page: #101b2b;
            --surface: #17283d;
            --surface-muted: #20354d;
            --ink: #f0f6fc;
            --muted: #aec0d1;
            --line: #354c66;
            --brand: #50d0cf;
            --brand-hover: #70e1dc;
            --accent: #ff9878;
            --stage: #132940;
            --shadow: 0 20px 48px rgba(0, 0, 0, 0.32);
            --brand-wash: #1d3d50;
            --blue-wash: #243854;
            --green-wash: #203f3b;
            --orange-wash: #493a36;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background-color: var(--page);
            background-image: repeating-linear-gradient(135deg, transparent 0 42px, rgba(44, 104, 145, 0.025) 42px 43px), linear-gradient(135deg, var(--page), var(--surface-muted));
            color: var(--ink);
            font-family: 'Cairo', 'Tahoma', sans-serif;
            transition: background 180ms ease, color 180ms ease;
        }

        button, select, input { font: inherit; }

        .app-header {
            position: sticky;
            top: 0;
            z-index: 30;
            min-height: 72px;
            padding: 12px clamp(18px, 4vw, 56px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            background: linear-gradient(108deg, #172d48 0%, #155463 58%, #087f72 100%);
            color: #f4f8f7;
            border-bottom: 3px solid #ed765c;
            box-shadow: 0 8px 24px rgba(19, 43, 62, 0.2);
            backdrop-filter: blur(12px);
        }

        .brand, .header-actions { display: flex; align-items: center; gap: 12px; }
        .brand { min-width: 0; }
        .brand-mark {
            width: 44px;
            height: 44px;
            flex: 0 0 44px;
            display: grid;
            place-items: center;
            border: 1px solid rgba(255, 255, 255, 0.48);
            border-radius: 12px;
            background: linear-gradient(145deg, #ffd66f 0%, #ffad60 54%, #f17e65 100%);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55), 0 5px 13px rgba(10, 28, 43, 0.2);
        }
        .brand-mark svg {
            width: 29px;
            height: 29px;
            overflow: visible;
            fill: none;
            stroke: #203448;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-width: 2.2;
        }
        #titleText {
            margin: 0;
            color: #ffffff;
            font-size: 20px;
            font-weight: 700;
            line-height: 1.4;
            text-shadow: 0 1px 10px rgba(6, 23, 37, 0.16);
        }
        .header-actions { gap: 8px; }
        .utility-btn {
            min-height: 38px;
            padding: 7px 12px;
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 5px;
            background: transparent;
            color: #f4f8f7;
            cursor: pointer;
        }
        .utility-btn:hover { background: rgba(255, 255, 255, 0.13); border-color: rgba(255, 255, 255, 0.36); }
        .history-controls {
            display: flex;
            align-items: center;
            gap: 3px;
            padding: 2px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 6px;
        }
        .history-btn {
            width: 34px;
            min-height: 34px;
            padding: 0;
            display: grid;
            place-items: center;
            border: 0;
            border-radius: 4px;
            font-family: Arial, sans-serif;
            font-size: 22px;
            line-height: 1;
        }
        .history-btn:disabled { opacity: 0.38; cursor: not-allowed; }
        .history-btn:not(:disabled):hover { background: rgba(255, 255, 255, 0.14); }
        .history-btn:focus-visible { outline: 2px solid #69d6c5; outline-offset: 2px; }
        .mode-menu { position: relative; }
        .mode-menu > summary { display: flex; align-items: center; gap: 8px; list-style: none; }
        .mode-menu > summary::-webkit-details-marker { display: none; }
        .mode-menu > summary::after { content: '▾'; font-size: 12px; }
        .mode-menu-panel {
            position: absolute;
            top: calc(100% + 8px);
            inset-inline-start: 0;
            z-index: 20;
            min-width: 190px;
            padding: 7px;
            display: grid;
            gap: 5px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 7px;
            box-shadow: var(--shadow);
        }
        .mode-menu-panel button {
            min-height: 38px;
            padding: 7px 10px;
            border: 0;
            border-radius: 4px;
            background: transparent;
            color: var(--ink);
            text-align: start;
            cursor: pointer;
        }
        .mode-menu-panel button:hover:not(:disabled) { background: var(--surface-muted); color: var(--brand); }
        .mode-menu-panel button:disabled { color: var(--muted); cursor: not-allowed; opacity: 0.6; }
        .mode-menu-panel .menu-divider { height: 1px; margin: 2px 0; background: var(--line); }
        #modeMenu .mode-menu-panel button {
            min-height: 38px;
            width: 100%;
            padding: 7px 10px;
            display: block;
            border: 0;
            border-radius: 4px;
            background: transparent;
            box-shadow: none;
            color: var(--ink);
            font-size: 13px;
            font-weight: 500;
            text-align: start;
            transform: none;
        }
        #modeMenu .mode-menu-panel button:hover:not(:disabled) { background: var(--surface-muted); color: var(--brand); box-shadow: none; }

        .editor-layout {
            width: min(100%, 1760px);
            min-height: calc(100vh - 72px);
            margin: 0 auto;
            padding: 20px clamp(14px, 2vw, 30px) 28px;
            display: grid;
            grid-template-columns: minmax(280px, 320px) minmax(0, 1fr);
            gap: 18px;
            align-items: stretch;
        }

        .tools-panel {
            position: sticky;
            top: 92px;
            max-height: calc(100vh - 112px);
            overflow-y: auto;
            padding: 17px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 9px;
            border-top: 3px solid transparent;
            border-image: linear-gradient(90deg, #ee7259, #f2b84b 32%, #159ca2 68%, #5275bd) 1;
            box-shadow: var(--shadow);
            scrollbar-width: thin;
            scrollbar-color: #bbcfca transparent;
        }
        .panel-heading {
            margin: -17px -17px 0;
            padding: 18px 20px 15px;
            border: 0;
            border-bottom: 2px solid var(--brand);
            border-radius: 7px 7px 0 0;
            background: linear-gradient(115deg, var(--brand-wash), var(--blue-wash) 56%, var(--orange-wash));
        }
        .panel-eyebrow {
            display: block;
            margin-bottom: 3px;
            color: var(--brand);
            font-family: 'Montserrat', sans-serif;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            direction: ltr;
            text-align: right;
        }
        #toolsTitle { margin: 0; font-size: 19px; font-weight: 700; }
        .section-label { margin: 0; min-height: 32px; padding: 6px 9px; display: flex; align-items: center; gap: 8px; border: 1px solid #d4e9ed; border-radius: 5px; background: linear-gradient(100deg, var(--brand-wash), transparent); color: var(--ink); font-size: 12px; font-weight: 700; }
        .section-label::before { width: 7px; height: 7px; flex: 0 0 7px; border-radius: 2px; background: var(--brand); content: ''; }
        #cleanupSectionTitle { border-color: #f3dec8; background: linear-gradient(100deg, var(--orange-wash), transparent); }
        #cleanupSectionTitle::before { background: #e58b3f; }
        #textSectionTitle { border-color: #d7e9dc; background: linear-gradient(100deg, var(--green-wash), transparent); }
        #textSectionTitle::before { background: #43886a; }
        .tool-divider { height: 1px; background: linear-gradient(90deg, transparent, var(--line), transparent); }
        #addPageBtn {
            min-height: 43px;
            width: 100%;
            padding: 9px 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            border: 1px solid #c5dce6;
            border-radius: 6px;
            background: linear-gradient(120deg, #edf5fb, #e9f7f4);
            color: #176273;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: background 140ms ease, transform 140ms ease;
        }
        #addPageBtn:hover { background: #dcece8; transform: translateY(-1px); }
        html.dark #addPageBtn { border-color: #456b65; background: #24413d; color: #a9e0d5; }
        html.dark #addPageBtn:hover { background: #2b4d47; }
        .upload-control, #recognizeTextBtn, #drawBtn, #rectangleEraseBtn, #addTextBtn, #editTextBtn, #replaceTextBtn, #formatPainterBtn,
        #increaseFontBtn, #decreaseFontBtn, #downloadBtn {
            min-height: 43px;
            width: 100%;
            padding: 9px 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            border: 1px solid transparent;
            border-radius: 5px;
            color: white;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            cursor: pointer;
            transition: background 140ms ease, transform 140ms ease, box-shadow 140ms ease;
        }
        .upload-control:hover, #recognizeTextBtn:hover, #drawBtn:hover, #rectangleEraseBtn:hover, #addTextBtn:hover,
        #editTextBtn:hover, #replaceTextBtn:hover, #formatPainterBtn:hover, #increaseFontBtn:hover, #decreaseFontBtn:hover, #downloadBtn:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 12px rgba(20, 48, 50, 0.12);
        }
        .upload-control { position: relative; background: var(--brand); }
        .upload-control::before { content: '+'; font-size: 20px; font-weight: 400; line-height: 1; }
        .upload-control:hover { background: var(--brand-hover); }
        .upload-control input { display: none; }
        #recognizeTextBtn {
            min-height: 46px;
            background: linear-gradient(110deg, #087f96, #13a89a);
            box-shadow: 0 6px 16px rgba(8, 127, 150, 0.25);
        }
        #recognizeTextBtn:hover { background: linear-gradient(110deg, #066572, #0a817e); box-shadow: 0 7px 17px rgba(8, 127, 140, 0.28); }
        #recognizeTextBtn:disabled { opacity: 0.65; cursor: wait; transform: none; }
        #drawBtn { background: linear-gradient(110deg, #d65d2d, #f0a333); }
        #drawBtn:hover { background: linear-gradient(110deg, #bd4d23, #dc8a25); }
        #drawBtn.is-active { background: #c84e57; }
        #rectangleEraseBtn { background: linear-gradient(110deg, #365fa8, #477fbd); }
        #rectangleEraseBtn:hover { background: linear-gradient(110deg, #294e91, #376ca8); }
        #rectangleEraseBtn.is-active { background: #c84e57; }
        #cropImageBtn { background: linear-gradient(110deg, #6456b5, #8771d1); }
        #cropImageBtn:hover { background: linear-gradient(110deg, #51439c, #705bbb); }
        #cropImageBtn.is-active { background: linear-gradient(110deg, #d65d2d, #ee8754); }
        #cropImageBtn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .crop-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
        .crop-actions.hidden { display: none; }
        #applyCropBtn, #cancelCropBtn {
            min-height: 39px;
            padding: 7px 9px;
            border: 1px solid transparent;
            border-radius: 5px;
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }
        #applyCropBtn { background: linear-gradient(110deg, #21805f, #36a17b); }
        #applyCropBtn:hover { background: #17694c; }
        #cancelCropBtn { background: linear-gradient(110deg, #65798c, #8292a2); }
        #cancelCropBtn:hover { background: #506375; }
        #cropStatus { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.65; }
        #cropStatus.hidden { display: none; }
        #addTextBtn { background: linear-gradient(110deg, #22805f, #3b9c70); }
        #addTextBtn:hover { background: linear-gradient(110deg, #17694c, #2d805b); }
        #editTextBtn { background: linear-gradient(110deg, #5357a8, #627bc6); }
        #editTextBtn:hover { background: linear-gradient(110deg, #41458e, #5066aa); }
        #replaceTextBtn { background: linear-gradient(110deg, #087f8c, #139b95); }
        #replaceTextBtn:hover { background: #066572; }
        #replaceTextBtn.hidden { display: none; }
        #formatPainterBtn { background: linear-gradient(110deg, #087f8c, #139b95); }
        #formatPainterBtn:hover { background: #066572; }
        #formatPainterBtn.is-ready { background: linear-gradient(110deg, #d9782d, #ed765c); }
        #formatPainterBtn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
        #increaseFontBtn { background: #087f8c; }
        #decreaseFontBtn { background: #65798c; }
        #downloadBtn { margin-top: 3px; background: linear-gradient(110deg, #d65f52, #ed765c); }
        #downloadBtn:hover { background: #c84e45; }
        #fontFamilyLabel, #colorLabel, #sizeLabel { color: var(--muted); font-size: 12px; font-weight: 700; }
        #fontFamilySelect {
            min-height: 42px;
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--line);
            border-radius: 5px;
            background: var(--surface-muted);
            color: var(--ink);
            outline: none;
        }
        #fontFamilySelect:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(8, 127, 114, 0.12); }

        #brushSettings { gap: 8px; }
        #brushSettings input[type="color"] { height: 38px; border: 1px solid var(--line); border-radius: 5px; }
        .hex-color-input {
            min-height: 38px;
            width: 100%;
            padding: 7px 9px;
            border: 1px solid var(--line);
            border-radius: 5px;
            background: var(--surface-muted);
            color: var(--ink);
            direction: ltr;
            text-align: left;
        }
        .hex-color-input:focus { border-color: var(--brand); outline: 2px solid rgba(8, 127, 114, 0.12); }
        #brushSettings input[type="range"] { accent-color: var(--brand); }
        #ocrStatus, #editTextHint { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.7; }
        #ocrStatus {
            padding: 10px 12px;
            border: 1px solid transparent;
            border-radius: 5px;
            background: var(--surface-muted);
        }
        #ocrStatus:not(:empty) {
            border-color: rgba(38, 125, 131, 0.18);
            border-inline-start: 3px solid var(--brand);
            color: var(--ink);
        }
        #ocrStatus:empty { display: none; }
        #recognizeTextBtn:focus-visible, .upload-control:focus-visible, #drawBtn:focus-visible, #cropImageBtn:focus-visible, #applyCropBtn:focus-visible, #cancelCropBtn:focus-visible, #replaceTextBtn:focus-visible, #formatPainterBtn:focus-visible, .tool-action:focus-visible,
        #rectangleEraseBtn:focus-visible, #addTextBtn:focus-visible, #editTextBtn:focus-visible {
            outline: 3px solid rgba(38, 125, 131, 0.3);
            outline-offset: 2px;
        }
        .size-controls { display: flex; gap: 8px; }
        .text-properties { display: grid; gap: 10px; padding-top: 12px; border-top: 1px solid var(--line); }
        .text-properties.hidden { display: none; }
        .tool-group {
            border: 1px solid var(--line);
            border-radius: 7px;
            background: var(--surface-muted);
        }
        .tool-group > summary {
            min-height: 42px;
            padding: 8px 11px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--ink);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            list-style: none;
        }
        .tool-group > summary::-webkit-details-marker { display: none; }
        .tool-group > summary::after { color: var(--brand); content: '+'; font-family: Arial, sans-serif; font-size: 18px; }
        .tool-group[open] > summary::after { content: '\2212'; }
        .tool-grid { padding: 0 8px 8px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
        .tool-action {
            min-height: 39px;
            padding: 6px 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border: 1px solid var(--line);
            border-radius: 5px;
            background: var(--surface);
            color: var(--ink);
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: border-color 140ms ease, color 140ms ease, background 140ms ease, transform 140ms ease;
        }
        .tool-action span { color: var(--brand); font-family: Arial, sans-serif; font-size: 16px; line-height: 1; }
        .tool-action:hover:not(:disabled) { transform: translateY(-1px); border-color: var(--brand); color: var(--brand); }
        .tool-action:disabled { opacity: 0.48; cursor: not-allowed; }
        .tool-group:focus-within { border-color: color-mix(in srgb, var(--brand) 42%, var(--line)); }
        .text-color-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        #textColorLabel { color: var(--muted); font-size: 12px; font-weight: 700; }
        #textColorInput { width: 54px; height: 38px; padding: 3px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); cursor: pointer; }
        .text-hex-color-input { width: 104px; }
        #sampleTextColorBtn {
            min-height: 38px;
            padding: 7px 10px;
            border: 1px solid var(--line);
            border-radius: 5px;
            background: var(--surface-muted);
            color: var(--ink);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }
        #sampleTextColorBtn:hover, #sampleTextColorBtn.is-active { border-color: var(--brand); color: var(--brand); background: rgba(8, 127, 114, 0.08); }
        #textPropertyStatus { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
        #textPropertyStatus.hidden { display: none; }

        .workspace {
            min-width: 0;
            min-height: calc(100vh - 112px);
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            justify-content: flex-start;
            gap: 12px;
            overflow: auto;
            background-color: var(--stage);
            background-image: radial-gradient(rgba(47, 101, 143, 0.2) 0.8px, transparent 0.8px), linear-gradient(145deg, #e8f2f8 0%, #e8edf9 52%, #f7eee8 100%);
            background-size: 19px 19px, 100% 100%;
            border: 1px solid #cbd9e8;
            border-radius: 11px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.82), 0 12px 30px rgba(41, 72, 101, 0.07);
        }
        html.dark .workspace { background-image: radial-gradient(rgba(104, 180, 197, 0.16) 0.8px, transparent 0.8px), linear-gradient(145deg, #1b354b 0%, #202c49 55%, #3a2d38 100%); border-color: #3b5269; }
        .canvas-container { margin: 0 auto; border: 1px solid rgba(41, 73, 97, 0.18); border-radius: 4px; background: #fff; box-shadow: 0 22px 54px rgba(27, 54, 79, 0.22), 0 3px 9px rgba(27, 54, 79, 0.1); }
        .page-tabs {
            order: 2;
            min-height: 42px;
            display: flex;
            align-items: center;
            gap: 7px;
            overflow-x: auto;
            border-top: 1px solid var(--line);
        }
        .page-tab {
            min-height: 34px;
            padding: 6px 13px;
            border: 1px solid transparent;
            border-radius: 5px 5px 0 0;
            background: transparent;
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
        }
        .page-tab:hover { background: var(--surface); color: var(--ink); }
        .page-tab.is-current { border-color: var(--line); border-bottom: 2px solid var(--accent); background: var(--surface); color: var(--brand); }
        .canvas-stage {
            position: relative;
            order: 1;
            min-width: 0;
            min-height: calc(100vh - 170px);
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto;
        }
        .empty-state {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            pointer-events: none;
            text-align: center;
        }
        .empty-state.hidden { display: none; }
        .empty-state-mark {
            width: 62px;
            height: 62px;
            display: grid;
            place-items: center;
            border: 1px solid #cfdfeb;
            border-radius: 17px;
            background: linear-gradient(145deg, #e4f4f4 0%, #e9eefc 58%, #fff1e8 100%);
            color: var(--brand);
            font-family: Arial, sans-serif;
            font-size: 31px;
            box-shadow: 0 10px 25px rgba(31, 74, 98, 0.13);
        }
        .empty-state h2 { margin: 0; color: var(--ink); font-size: 20px; font-weight: 700; }
        #emptyUploadBtn {
            min-height: 42px;
            padding: 8px 18px;

        const maxHistoryStates = 30;
        let historyCaptureTimer = null;
        let isRestoringCanvas = false;

        function captureCanvasHistoryState() {
            const page = pages[activePageIndex];
            if (!page || !canvas) return null;
            return JSON.stringify({
                canvas: canvas.toJSON(['isOcrText', 'ocrCommitted', 'ocrWordData']),
                width: canvas.getWidth(),
                height: canvas.getHeight(),
                imageScale,
                ocrWords: ocrWords.map(word => ({ ...word, bbox: { ...word.bbox } })),
                rectangleMode: page.rectangleMode,
                drawingMode: canvas.isDrawingMode
            });
        }

        function updateHistoryButtons() {
            const page = pages[activePageIndex];
            const undoButton = document.getElementById('undoBtn');
            const redoButton = document.getElementById('redoBtn');
            if (!undoButton || !redoButton) return;
            undoButton.disabled = !page || page.historyIndex <= 0;
            redoButton.disabled = !page || page.historyIndex >= page.history.length - 1;
        }

        function storeCanvasHistoryState() {
            if (isRestoringCanvas) return;
            const page = pages[activePageIndex];
            const snapshot = captureCanvasHistoryState();
            if (!page || !snapshot) return;
            if (!Array.isArray(page.history)) {
                page.history = [];
                page.historyIndex = -1;
            }
            if (page.history[page.historyIndex] === snapshot) return;

            page.history.splice(page.historyIndex + 1);
            page.history.push(snapshot);
            if (page.history.length > maxHistoryStates) page.history.shift();
            page.historyIndex = page.history.length - 1;
            updateHistoryButtons();
        }

        function scheduleCanvasHistoryCapture(event) {
            if (isRestoringCanvas || (isCropMode && (event?.target === cropFrame || cropShadeObjects.includes(event?.target)))) return;
            clearTimeout(historyCaptureTimer);
            historyCaptureTimer = setTimeout(() => {
                historyCaptureTimer = null;
                storeCanvasHistoryState();
            }, 180);
        }

        function flushCanvasHistoryCapture() {
            if (historyCaptureTimer === null) return;
            clearTimeout(historyCaptureTimer);
            historyCaptureTimer = null;
            storeCanvasHistoryState();
        }

        function initializePageHistory(page) {
            if (!Array.isArray(page.history) || !Number.isInteger(page.historyIndex)) {
                page.history = [];
                page.historyIndex = -1;
            }
            if (page.historyIndex < 0) storeCanvasHistoryState();
            updateHistoryButtons();
        }

        function bindCanvasHistory() {
            ['object:added', 'object:modified', 'object:removed', 'path:created', 'text:changed'].forEach(eventName => {
                canvas.on(eventName, scheduleCanvasHistoryCapture);
            });
            document.getElementById('undoBtn').addEventListener('click', undoCanvasChange);
            document.getElementById('redoBtn').addEventListener('click', redoCanvasChange);
            document.addEventListener('keydown', handleHistoryShortcut, true);
        }

        function restoreCanvasHistoryState(snapshot) {
            const page = pages[activePageIndex];
            const state = JSON.parse(snapshot);
            page.json = state.canvas;
            page.width = state.width;
            page.height = state.height;
            page.imageData = state.canvas.backgroundImage?.src || null;
            page.imageScale = state.imageScale;
            page.ocrWords = state.ocrWords;
            page.ocrSourceData = page.imageData;
            page.rectangleMode = state.rectangleMode;
            page.drawingMode = state.drawingMode;
            restorePageAtIndex(activePageIndex);
        }

        function undoCanvasChange() {
            flushCanvasHistoryCapture();
            const page = pages[activePageIndex];
            if (!page || page.historyIndex <= 0) return;
            page.historyIndex--;
            restoreCanvasHistoryState(page.history[page.historyIndex]);
            updateHistoryButtons();
        }

        function redoCanvasChange() {
            flushCanvasHistoryCapture();
            const page = pages[activePageIndex];
            if (!page || page.historyIndex >= page.history.length - 1) return;
            page.historyIndex++;
            restoreCanvasHistoryState(page.history[page.historyIndex]);
            updateHistoryButtons();
        }

        function handleHistoryShortcut(event) {
            if (isCropMode) {
                if (event.key === 'Escape') {
                    event.preventDefault();
                    cancelCropMode();
                } else if (event.key === 'Enter') {
                    event.preventDefault();
                    applyCropSelection();
                }
                return;
            }
            if (event.key === 'Escape' && isFormatPainterArmed) {
                event.preventDefault();
                cancelTextFormatPainter();
                return;
            }
            const target = event.target;
            const isCanvasTextInput = target === canvas.getActiveObject()?.hiddenTextarea;
            if ((event.key === 'Delete' || event.key === 'Backspace') && !event.ctrlKey && !event.metaKey && !event.altKey && !isCanvasTextInput) {
                if (target instanceof HTMLElement && (target.isContentEditable || /^(INPUT|SELECT|TEXTAREA)$/.test(target.tagName))) return;
                const activeObject = canvas.getActiveObject();
                if (activeObject && !activeObject.isEditing) {
                    event.preventDefault();
                    deleteSelectedObject();
                    return;
                }
            }
            if (!(event.ctrlKey || event.metaKey) || event.altKey) return;
            if (target instanceof HTMLElement && (target.isContentEditable ||
                (/^(INPUT|SELECT|TEXTAREA)$/.test(target.tagName) && !isCanvasTextInput))) return;

            const key = event.key.toLowerCase();
            const undo = key === 'z' && !event.shiftKey;
            const redo = key === 'y' || (key === 'z' && event.shiftKey);
            if (!undo && !redo) return;
            event.preventDefault();
            event.stopPropagation();
            if (undo) undoCanvasChange();
            else redoCanvasChange();
        }

        // تهيئة اللوحة (Canvas)
        window.onload = function() {
            canvas = new fabric.Canvas('canvas', {
                width: 500,
                height: 500,
                backgroundColor: '#f3f4f6'
            });
            canvas.upperCanvasEl.addEventListener('click', event => {
                if (Date.now() - lastCanvasTouchAt < 700) {
                    lastCanvasTouchAt = 0;
                    return;
                }
                editSelectedText(event);
            });
            canvas.upperCanvasEl.addEventListener('dblclick', selectOcrPhrase);
            canvas.upperCanvasEl.addEventListener('click', sampleSelectedTextColor, true);
            canvas.upperCanvasEl.addEventListener('touchstart', event => {
                if (event.touches.length !== 1) {
                    canvasTouchStart = null;
                    return;
                }
                const touch = event.touches[0];
                canvasTouchStart = { x: touch.clientX, y: touch.clientY };
            }, { passive: true });
            canvas.upperCanvasEl.addEventListener('touchend', event => {
                const touch = event.changedTouches[0];
                const start = canvasTouchStart;
                canvasTouchStart = null;
                if (!touch || !start || canvas.isDrawingMode) return;

                const movement = Math.hypot(touch.clientX - start.x, touch.clientY - start.y);
                if (movement > 14) return;

                const bounds = canvas.upperCanvasEl.getBoundingClientRect();
                const pointer = {
                    x: (touch.clientX - bounds.left) * canvas.getWidth() / bounds.width,
                    y: (touch.clientY - bounds.top) * canvas.getHeight() / bounds.height
                };
                lastCanvasTouchAt = Date.now();
                if (isPickingTextColor) sampleSelectedTextColor(null, pointer);
                else editSelectedText(null, pointer);
                event.preventDefault();
            }, { passive: false });
            canvas.upperCanvasEl.addEventListener('touchcancel', () => {
                canvasTouchStart = null;
            }, { passive: true });
            canvas.on('selection:created', updateTextProperties);
            canvas.on('selection:updated', updateTextProperties);
            canvas.on('selection:cleared', updateTextProperties);
            bindObjectTools();
            canvas.on('object:added', updateEmptyState);
            canvas.on('object:removed', updateEmptyState);
            canvas.on('object:added', updateCropButtonState);
            canvas.on('object:removed', updateCropButtonState);
            document.getElementById('emptyUploadBtn').addEventListener('click', () => {
                document.getElementById('uploadImageBtn').click();
            });
            // إعدادات الفرشاة
            canvas.freeDrawingBrush.color = document.getElementById('brushColor').value;
            canvas.freeDrawingBrush.width = parseInt(document.getElementById('brushSize').value, 10);
            pages = [{
                json: canvas.toJSON(['isOcrText', 'ocrCommitted', 'ocrWordData']),
                width: canvas.getWidth(),
                height: canvas.getHeight(),
                imageData: null,
                imageScale: 1,
                ocrWords: [],
                ocrSourceData: null,
                rectangleMode: false,
                drawingMode: false
            }];
            setupRectangleDrawing();
            bindCanvasHistory();
            initializePageHistory(pages[0]);
            renderPageTabs();
            updateEmptyState();
            updateCropButtonState();
            fitCanvasToWorkspace();
            window.addEventListener('resize', fitCanvasToWorkspace);
        };

        function fitCanvasToWorkspace() {
            if (!canvas) return;
            const workspace = canvas.wrapperEl.parentElement;
            const maxWidth = Math.max(1, workspace.clientWidth - 32);
            const maxHeight = Math.max(1, workspace.clientHeight - 24);
            const displayScale = Math.min(1, maxWidth / canvas.getWidth(), maxHeight / canvas.getHeight());
            const displayWidth = Math.round(canvas.getWidth() * displayScale);
            const displayHeight = Math.round(canvas.getHeight() * displayScale);

            canvas.wrapperEl.style.width = `${displayWidth}px`;
            canvas.wrapperEl.style.height = `${displayHeight}px`;
            [canvas.lowerCanvasEl, canvas.upperCanvasEl].forEach(element => {
                element.style.width = `${displayWidth}px`;
                element.style.height = `${displayHeight}px`;
            });
            canvas.calcOffset();
        }

        function updateEmptyState() {
            const emptyState = document.getElementById('emptyState');
            if (!emptyState || !canvas) return;
            emptyState.classList.toggle('hidden', Boolean(canvas.backgroundImage || canvas.getObjects().length));
        }

        function colorToHex(color) {
            if (typeof color !== 'string') return '#183238';
            if (color.startsWith('#')) return color.slice(0, 7);
            const channels = color.match(/\d+/g);
            if (!channels || channels.length < 3) return '#183238';
            return `#${channels.slice(0, 3).map(channel => Number(channel).toString(16).padStart(2, '0')).join('')}`;
        }

        function connectHexColorInput(colorInputId, hexInputId, onColorChange) {
            const colorInput = document.getElementById(colorInputId);
            const hexInput = document.getElementById(hexInputId);
            const isValidHex = value => /^#[0-9a-fA-F]{6}$/.test(value);

            colorInput.addEventListener('input', () => {
                hexInput.value = colorInput.value;
                onColorChange(colorInput.value);
            });
            hexInput.addEventListener('input', () => {
                const value = hexInput.value.trim();
                if (!isValidHex(value)) return;
                colorInput.value = value;
                onColorChange(value);
            });
            hexInput.addEventListener('change', () => {
                if (!isValidHex(hexInput.value.trim())) hexInput.value = colorInput.value;
            });
        }

        function updateTextProperties() {
            const properties = document.getElementById('textProperties');
            if (!properties || !canvas) return;
            const text = canvas.getActiveObject();
            updateObjectToolAvailability(text);
            updateFormatPainterButton(text);
            const canReplaceDetectedText = text instanceof fabric.IText && text.isOcrText && !text.ocrCommitted && text.ocrWordData;
            document.getElementById('replaceTextBtn').classList.toggle('hidden', !canReplaceDetectedText);
            if (!(text instanceof fabric.IText)) {
                properties.classList.add('hidden');
                return;
            }

            properties.classList.remove('hidden');
            const fontSelector = document.getElementById('fontFamilySelect');
            if (![...fontSelector.options].some(option => option.value === text.fontFamily)) {
                fontSelector.add(new Option(text.fontFamily, text.fontFamily));
            }
            fontSelector.value = text.fontFamily;
            const fill = text.isOcrText && !text.ocrCommitted ? text.ocrWordData?.textColor : text.fill;
            const textColor = colorToHex(fill);
            document.getElementById('textColorInput').value = textColor;
            document.getElementById('textColorHex').value = textColor;
        }

        function updateObjectToolAvailability(activeObject = canvas?.getActiveObject()) {
            const hasObject = Boolean(!isCropMode && activeObject && canvas?.getObjects().includes(activeObject));
            const objects = hasObject ? canvas.getObjects() : [];
            const index = hasObject ? objects.indexOf(activeObject) : -1;
            document.getElementById('duplicateObjectBtn').disabled = !hasObject;
            document.getElementById('deleteObjectBtn').disabled = !hasObject;
            document.getElementById('bringForwardBtn').disabled = !hasObject || index >= objects.length - 1;
            document.getElementById('sendBackwardBtn').disabled = !hasObject || index <= 0;
            document.getElementById('rotateObjectBtn').disabled = !hasObject;
            document.getElementById('flipHorizontalBtn').disabled = !hasObject;
            document.getElementById('flipVerticalBtn').disabled = !hasObject;
        }

        function finishObjectEdit(object) {
            object.setCoords();
            canvas.setActiveObject(object);
            canvas.requestRenderAll();
            updateTextProperties();
            scheduleCanvasHistoryCapture();
        }

        function duplicateSelectedObject() {
            const source = canvas.getActiveObject();
            if (!source || !canvas.getObjects().includes(source)) return Promise.resolve(null);
            if (source.isOcrText && !source.ocrCommitted) commitOcrText(source);
            const originalIndex = canvas.getObjects().indexOf(source);
            return new Promise(resolve => {
                source.clone(clone => {
                    clone.set({ left: source.left + 20, top: source.top + 20, isOcrText: false, ocrCommitted: false });
                    delete clone.ocrWordData;
                    canvas.insertAt(clone, originalIndex + 1);
                    canvas.setActiveObject(clone);
                    finishObjectEdit(clone);
                    resolve(clone);
                }, ['isOcrText', 'ocrCommitted', 'ocrWordData']);
            });
        }

        function deleteSelectedObject() {
            const object = canvas.getActiveObject();
            if (!object || !canvas.getObjects().includes(object)) return;
            if (object.isOcrText && !object.ocrCommitted && object.ocrWordData && !ocrWords.includes(object.ocrWordData)) {
                ocrWords.push(object.ocrWordData);
            }
            canvas.remove(object);
            ocrObjects = ocrObjects.filter(ocrObject => ocrObject !== object);
            canvas.discardActiveObject();
            updateTextProperties();
            canvas.requestRenderAll();
            scheduleCanvasHistoryCapture();
        }

        function moveSelectedObjectInStack(direction) {
            const object = canvas.getActiveObject();
            if (!object || !canvas.getObjects().includes(object)) return;
            const objects = canvas.getObjects();
            const index = objects.indexOf(object);
            const targetIndex = Math.max(0, Math.min(objects.length - 1, index + direction));
            if (targetIndex === index) return;
            canvas.moveTo(object, targetIndex);
            finishObjectEdit(object);
        }

        function transformSelectedObject(transform) {
            const object = canvas.getActiveObject();
            if (!object || !canvas.getObjects().includes(object)) return;
            const center = object.getCenterPoint();
            transform(object);
            object.setPositionByOrigin(center, 'center', 'center');
            finishObjectEdit(object);
        }

        function bindObjectTools() {
            document.getElementById('duplicateObjectBtn').addEventListener('click', duplicateSelectedObject);
            document.getElementById('deleteObjectBtn').addEventListener('click', deleteSelectedObject);
            document.getElementById('bringForwardBtn').addEventListener('click', () => moveSelectedObjectInStack(1));
            document.getElementById('sendBackwardBtn').addEventListener('click', () => moveSelectedObjectInStack(-1));
            document.getElementById('rotateObjectBtn').addEventListener('click', () => {
                transformSelectedObject(object => object.rotate((object.angle || 0) + 90));
            });
            document.getElementById('flipHorizontalBtn').addEventListener('click', () => {
                transformSelectedObject(object => object.set('flipX', !object.flipX));
            });
            document.getElementById('flipVerticalBtn').addEventListener('click', () => {
                transformSelectedObject(object => object.set('flipY', !object.flipY));
            });
        }

        function updateFormatPainterButton(activeText = canvas?.getActiveObject()) {
            const button = document.getElementById('formatPainterBtn');
            if (!button) return;
            const hasText = activeText instanceof fabric.IText;
            const lang = isArabic ? 'ar' : 'en';
            button.disabled = !hasText;
            button.textContent = translations[lang][isFormatPainterArmed ? 'cancelTextFormat' : 'copyTextFormat'];
            button.title = isFormatPainterArmed ? translations[lang].formatTextHint : button.textContent;
            button.setAttribute('aria-label', button.textContent);
            button.classList.toggle('is-ready', isFormatPainterArmed);
        }

        function copyTextFormat(text) {
            const fill = text.isOcrText && !text.ocrCommitted ? text.ocrWordData?.textColor : text.fill;
            textStyleClipboard = {
                fontFamily: text.fontFamily,
                fontSize: text.fontSize,
                fontWeight: text.fontWeight,
                fontStyle: text.fontStyle,
                underline: text.underline,
                linethrough: text.linethrough,
                overline: text.overline,
                textAlign: text.textAlign,
                lineHeight: text.lineHeight,
                charSpacing: text.charSpacing,
                fill,
                stroke: text.stroke,
                strokeWidth: text.strokeWidth,
                opacity: text.opacity
            };
            textStyleSource = text;
            isFormatPainterArmed = true;
            updateFormatPainterButton(text);
        }

        function cancelTextFormatPainter() {
            textStyleClipboard = null;
            textStyleSource = null;
            isFormatPainterArmed = false;
            updateFormatPainterButton();
        }

        function applyCopiedTextFormat(text) {
            if (!(text instanceof fabric.IText) || !textStyleClipboard) return;
            commitOcrText(text);
            text.set({ ...textStyleClipboard });
            text.initDimensions();
            text.setCoords();
            canvas.setActiveObject(text);
            canvas.renderAll();
            cancelTextFormatPainter();
            updateTextProperties();
            scheduleCanvasHistoryCapture();
        }

        document.getElementById('formatPainterBtn').addEventListener('click', () => {
            const text = canvas.getActiveObject();
            if (!(text instanceof fabric.IText)) return;
            if (isFormatPainterArmed) {
                cancelTextFormatPainter();
                return;
            }
            copyTextFormat(text);
        });

        function cancelTextColorSampling() {
            isPickingTextColor = false;
            textColorTarget = null;
            document.getElementById('sampleTextColorBtn').classList.remove('is-active');
            document.getElementById('textPropertyStatus').classList.add('hidden');
        }

        function sampleSelectedTextColor(event, pointerOverride) {
            if (!isPickingTextColor || (!event && !pointerOverride)) return false;
            canvas.calcOffset();
            const text = textColorTarget;
            const background = canvas.backgroundImage;
            const sourceElement = ocrSourceCanvas || background?.getElement();
            if (!(text instanceof fabric.IText) || !sourceElement) {
                document.getElementById('textPropertyStatus').textContent = translations[isArabic ? 'ar' : 'en'].sampleColorError;
                document.getElementById('textPropertyStatus').classList.remove('hidden');
                cancelTextColorSampling();
                return false;
            }

            const pointer = pointerOverride || canvas.getPointer(event);
            const sourceX = Math.floor((pointer.x - (background?.left || 0)) / (background?.scaleX || 1));
            const sourceY = Math.floor((pointer.y - (background?.top || 0)) / (background?.scaleY || 1));
            const sourceCanvas = ocrSourceCanvas || document.createElement('canvas');
            let sourceContext = ocrSourceContext;
            if (!ocrSourceCanvas) {
                sourceCanvas.width = sourceElement.naturalWidth || sourceElement.width;
                sourceCanvas.height = sourceElement.naturalHeight || sourceElement.height;
                sourceContext = sourceCanvas.getContext('2d', { willReadFrequently: true });
                sourceContext.drawImage(sourceElement, 0, 0);
            }

            if (sourceX < 0 || sourceY < 0 || sourceX >= sourceCanvas.width || sourceY >= sourceCanvas.height) return false;
            const pixel = sourceContext.getImageData(sourceX, sourceY, 1, 1).data;
            const color = `#${[pixel[0], pixel[1], pixel[2]].map(channel => channel.toString(16).padStart(2, '0')).join('')}`;
            commitOcrText(text);
            text.set('fill', color);
            canvas.setActiveObject(text);
            text.setCoords();
            document.getElementById('textColorInput').value = color;
            document.getElementById('textColorHex').value = color;
            canvas.renderAll();
            scheduleCanvasHistoryCapture();
            cancelTextColorSampling();
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
        }

        function renderPageTabs() {
            const tabs = document.getElementById('pageTabs');
            const lang = isArabic ? 'ar' : 'en';
            tabs.setAttribute('aria-label', translations[lang].pages);
            tabs.replaceChildren();
            pages.forEach((page, index) => {
                const tab = document.createElement('button');
                tab.type = 'button';
                tab.className = `page-tab${index === activePageIndex ? ' is-current' : ''}`;
                tab.role = 'tab';
                tab.setAttribute('aria-selected', index === activePageIndex ? 'true' : 'false');
                tab.dataset.pageIndex = index;
                tab.textContent = `${translations[lang].page} ${index + 1}`;
                tabs.appendChild(tab);
            });
        }

        function saveActivePage() {
            flushCanvasHistoryCapture();
            const page = pages[activePageIndex];
            if (!page || !canvas) return;

            page.json = canvas.toJSON(['isOcrText', 'ocrCommitted', 'ocrWordData']);
            page.width = canvas.getWidth();
            page.height = canvas.getHeight();
            page.imageData = currentImageData;
            page.imageScale = imageScale;
            page.ocrWords = ocrWords.map(word => ({ ...word, bbox: { ...word.bbox } }));
            page.ocrSourceData = ocrSourceCanvas ? ocrSourceCanvas.toDataURL('image/png') : null;
            page.drawingMode = canvas.isDrawingMode;
        }

        function restoreOcrSource(sourceData) {
            ocrSourceCanvas = null;
            ocrSourceContext = null;
            if (!sourceData) return;

            const sourceImage = new Image();
            sourceImage.onload = () => {
                ocrSourceCanvas = document.createElement('canvas');
                ocrSourceCanvas.width = sourceImage.naturalWidth;
                ocrSourceCanvas.height = sourceImage.naturalHeight;
                ocrSourceContext = ocrSourceCanvas.getContext('2d', { willReadFrequently: true });
                ocrSourceContext.drawImage(sourceImage, 0, 0);
            };
            sourceImage.src = sourceData;
        }

        function switchToPage(index) {
            if (index === activePageIndex || !pages[index]) return;
            if (isCropMode) cancelCropMode();
            flushCanvasHistoryCapture();
            saveActivePage();
            restorePageAtIndex(index);
        }

        function restorePageAtIndex(index) {
            clearTimeout(historyCaptureTimer);
            historyCaptureTimer = null;
            isRestoringCanvas = true;
            activePageIndex = index;
            const page = pages[index];
            currentImageData = page.imageData;
            imageScale = page.imageScale;
            ocrWords = page.ocrWords.map(word => ({ ...word, bbox: { ...word.bbox } }));
            restoreOcrSource(page.ocrSourceData);
            rectangleInProgress = null;

            canvas.isDrawingMode = false;
            canvas.setWidth(page.width);
            canvas.setHeight(page.height);
            canvas.loadFromJSON(page.json, () => {
                ocrObjects = canvas.getObjects().filter(object => object.isOcrText);
                ocrObjects.forEach(object => {
                    object.on('changed', () => commitOcrText(object));
                });
                canvas.isDrawingMode = isRectMaskMode ? false : page.drawingMode;
                document.getElementById('brushSettings').style.display = (canvas.isDrawingMode || isRectMaskMode) ? 'flex' : 'none';
                document.getElementById('drawBtn').classList.toggle('is-active', canvas.isDrawingMode);
                document.getElementById('drawBtn').textContent = translations[isArabic ? 'ar' : 'en'][canvas.isDrawingMode ? 'drawActive' : 'draw'];
                document.getElementById('rectangleEraseBtn').classList.toggle('is-active', isRectMaskMode);
                document.getElementById('rectangleEraseBtn').textContent = translations[isArabic ? 'ar' : 'en'][isRectMaskMode ? 'rectangleEraseActive' : 'rectangleErase'];
                canvas.skipTargetFind = isRectMaskMode;
                canvas.selection = !isRectMaskMode;
                canvas.upperCanvasEl.style.touchAction = isRectMaskMode || page.rectangleMode ? 'none' : 'manipulation';
                isRestoringCanvas = false;
                initializePageHistory(page);
                updateEmptyState();
                updateCropButtonState();
                canvas.renderAll();
                renderPageTabs();
                fitCanvasToWorkspace();
                updateTextProperties();
            });
        }

        function addNewPage() {
            if (isCropMode) cancelCropMode();
            saveActivePage();
            const page = {
                json: null,
                width: 794,
                height: 1123,
                imageData: null,
                imageScale: 1,
                ocrWords: [],
                ocrSourceData: null,
                rectangleMode: true,
                drawingMode: false
            };
            pages.push(page);
            activePageIndex = pages.length - 1;
            currentImageData = null;
            imageScale = 1;
            ocrWords = [];
            ocrObjects = [];
            ocrSourceCanvas = null;
            ocrSourceContext = null;
            rectangleInProgress = null;

            isRestoringCanvas = true;
            canvas.isDrawingMode = false;
            canvas.clear();
            canvas.setWidth(page.width);
            canvas.setHeight(page.height);
            canvas.setBackgroundColor('#ffffff', () => {
                page.json = canvas.toJSON(['isOcrText', 'ocrCommitted', 'ocrWordData']);
                isRestoringCanvas = false;
                initializePageHistory(page);
                updateEmptyState();
                updateCropButtonState();
                renderPageTabs();
                fitCanvasToWorkspace();
            });
            canvas.upperCanvasEl.style.touchAction = 'none';
            document.getElementById('brushSettings').style.display = 'none';
            document.getElementById('drawBtn').classList.remove('is-active');
            document.getElementById('drawBtn').textContent = translations[isArabic ? 'ar' : 'en'].draw;
            document.getElementById('editTextHint').classList.add('hidden');
        }

        function updateCropButtonState() {
            const button = document.getElementById('cropImageBtn');
            if (!button) return;
            const lang = isArabic ? 'ar' : 'en';
            button.disabled = !isCropMode && !canvas?.backgroundImage;
            button.classList.toggle('is-active', isCropMode);
            button.textContent = translations[lang][isCropMode ? 'cropImageActive' : 'cropImage'];
            document.getElementById('cropActions').classList.toggle('hidden', !isCropMode);
            document.getElementById('cropStatus').classList.toggle('hidden', !isCropMode);
            document.getElementById('cropStatus').textContent = isCropMode ? translations[lang].cropHint : '';
            document.getElementById('applyCropBtn').disabled = !cropFrame || cropFrame.getScaledWidth() < 24 || cropFrame.getScaledHeight() < 24;
        }

        function syncCropShade() {
            if (!isCropMode || !cropFrame || cropShadeObjects.length !== 4) return;
            const left = Math.max(0, cropFrame.left);
            const top = Math.max(0, cropFrame.top);
            const right = Math.min(canvas.getWidth(), cropFrame.left + cropFrame.getScaledWidth());
            const bottom = Math.min(canvas.getHeight(), cropFrame.top + cropFrame.getScaledHeight());
            const regions = [
                { left: 0, top: 0, width: canvas.getWidth(), height: top },
                { left: 0, top, width: left, height: Math.max(0, bottom - top) },
                { left: right, top, width: Math.max(0, canvas.getWidth() - right), height: Math.max(0, bottom - top) },
                { left: 0, top: bottom, width: canvas.getWidth(), height: Math.max(0, canvas.getHeight() - bottom) }
            ];
            cropShadeObjects.forEach((shade, index) => {
                shade.set(regions[index]);
                shade.setCoords();
            });
            cropFrame.setCoords();
            updateCropButtonState();
            canvas.requestRenderAll();
        }

        function startCropMode() {
            if (isCropMode) {
                cancelCropMode();
                return;
            }
            const background = canvas.backgroundImage;
            if (!background) return;
            flushCanvasHistoryCapture();
            cancelTextColorSampling();
            if (isFormatPainterArmed) cancelTextFormatPainter();

            cropPreviousModes = {
                drawingMode: canvas.isDrawingMode,
                rectangleMode: isRectMaskMode,
                selection: canvas.selection,
                skipTargetFind: canvas.skipTargetFind,
                touchAction: canvas.upperCanvasEl.style.touchAction
            };
            cropObjectStates = canvas.getObjects().map(object => ({
                object,
                selectable: object.selectable,
                evented: object.evented
            }));
            cropObjectStates.forEach(state => {
                if (state.object.isEditing) state.object.exitEditing();
                state.object.set({ selectable: false, evented: false });
            });
            canvas.discardActiveObject();
            canvas.isDrawingMode = false;
            isRectMaskMode = false;
            canvas.selection = false;
            canvas.skipTargetFind = false;
            canvas.upperCanvasEl.style.touchAction = 'none';
            document.getElementById('brushSettings').style.display = 'none';
            document.getElementById('drawBtn').classList.remove('is-active');
            document.getElementById('drawBtn').textContent = translations[isArabic ? 'ar' : 'en'].draw;
            document.getElementById('rectangleEraseBtn').classList.remove('is-active');
            document.getElementById('rectangleEraseBtn').textContent = translations[isArabic ? 'ar' : 'en'].rectangleErase;
            updateCropButtonState();

            const imageLeft = background.left || 0;
            const imageTop = background.top || 0;
            const imageWidth = (background.width || canvas.getWidth()) * (background.scaleX || 1);
            const imageHeight = (background.height || canvas.getHeight()) * (background.scaleY || 1);
            const insetX = 0;
            const insetY = 0;
            cropFrame = new fabric.Rect({
                left: imageLeft + insetX,
                top: imageTop + insetY,
                width: Math.max(24, imageWidth - insetX * 2),
                height: Math.max(24, imageHeight - insetY * 2),
                fill: 'rgba(255, 255, 255, 0.025)',
                stroke: '#ffffff',
                strokeWidth: 2,
                strokeUniform: true,
                cornerColor: '#ffffff',
                cornerStrokeColor: '#087f96',
                cornerStyle: 'circle',
                cornerSize: 13,
                transparentCorners: false,
                borderColor: '#087f96',
                borderScaleFactor: 2,
                lockRotation: true,
                lockScalingFlip: true,
                objectCaching: false,
                excludeFromExport: true,
                cropFrame: true
            });
            cropShadeObjects = Array.from({ length: 4 }, () => new fabric.Rect({
                left: 0,
                top: 0,
                width: 1,
                height: 1,
                fill: 'rgba(12, 24, 38, 0.48)',
                strokeWidth: 0,
                selectable: false,
                evented: false,
                excludeFromExport: true,
                objectCaching: false
            }));

            isCropMode = true;
            isRestoringCanvas = true;
            cropShadeObjects.forEach(shade => canvas.add(shade));
            canvas.add(cropFrame);
            isRestoringCanvas = false;
            cropFrameHandlers = { sync: syncCropShade };
            cropFrame.on('moving', cropFrameHandlers.sync);
            cropFrame.on('scaling', cropFrameHandlers.sync);
            cropFrame.on('modified', cropFrameHandlers.sync);
            canvas.setActiveObject(cropFrame);
            syncCropShade();
            updateObjectToolAvailability();
        }

        function stopCropMode() {
            if (!isCropMode) return;
            isRestoringCanvas = true;
            if (cropFrame && cropFrameHandlers) {
                cropFrame.off('moving', cropFrameHandlers.sync);
                cropFrame.off('scaling', cropFrameHandlers.sync);
                cropFrame.off('modified', cropFrameHandlers.sync);
            }
            if (cropFrame) canvas.remove(cropFrame);
            cropShadeObjects.forEach(shade => canvas.remove(shade));
            cropObjectStates.forEach(state => {

            cropShadeObjects = [];
            cropObjectStates = [];
            cropFrameHandlers = null;

            if (cropPreviousModes) {
                canvas.isDrawingMode = cropPreviousModes.drawingMode;

        async function applyCropSelection() {
            if (!isCropMode || !cropFrame || !canvas.backgroundImage) return;
            const frameBounds = {
                left: cropFrame.left,
                top: cropFrame.top,
                right: cropFrame.left + cropFrame.getScaledWidth(),
                bottom: cropFrame.top + cropFrame.getScaledHeight()
            };
            const background = canvas.backgroundImage;
            const source = background.getElement();
            const sourceWidth = source.naturalWidth || source.width;
            const sourceHeight = source.naturalHeight || source.height;
            const scaleX = background.scaleX || 1;
            const scaleY = background.scaleY || 1;
            const backgroundLeft = background.left || 0;
            const backgroundTop = background.top || 0;
            const sourceLeft = Math.max(0, Math.floor((frameBounds.left - backgroundLeft) / scaleX));
            const sourceTop = Math.max(0, Math.floor((frameBounds.top - backgroundTop) / scaleY));
            const sourceRight = Math.min(sourceWidth, Math.ceil((frameBounds.right - backgroundLeft) / scaleX));
            const sourceBottom = Math.min(sourceHeight, Math.ceil((frameBounds.bottom - backgroundTop) / scaleY));
            const croppedWidth = sourceRight - sourceLeft;
            const croppedHeight = sourceBottom - sourceTop;
            if (croppedWidth < 24 || croppedHeight < 24) {
                document.getElementById('cropStatus').textContent = translations[isArabic ? 'ar' : 'en'].cropTooSmall;
                return;
            }

            const cropCanvas = document.createElement('canvas');
            cropCanvas.width = croppedWidth;
            cropCanvas.height = croppedHeight;
            cropCanvas.getContext('2d').drawImage(source, sourceLeft, sourceTop, croppedWidth, croppedHeight, 0, 0, croppedWidth, croppedHeight);
            const croppedImageData = cropCanvas.toDataURL('image/png');
            const pageCropLeft = backgroundLeft + sourceLeft * scaleX;
            const pageCropTop = backgroundTop + sourceTop * scaleY;
            const nextWidth = Math.max(1, Math.round(croppedWidth * scaleX));
            const nextHeight = Math.max(1, Math.round(croppedHeight * scaleY));

            stopCropMode();
            isRestoringCanvas = true;
            const visibleRight = pageCropLeft + nextWidth;
            const visibleBottom = pageCropTop + nextHeight;
            const removedObjects = new Set();
            canvas.getObjects().slice().forEach(object => {
                const bounds = object.getBoundingRect(true, true);
                const intersectsCrop = bounds.left < visibleRight && bounds.left + bounds.width > pageCropLeft &&
                    bounds.top < visibleBottom && bounds.top + bounds.height > pageCropTop;
                if (!intersectsCrop) {
                    if (object.isOcrText && object.ocrWordData) removedObjects.add(object);
                    canvas.remove(object);
                    return;
                }
                object.set({ left: object.left - pageCropLeft, top: object.top - pageCropTop });
                if (object.isOcrText && object.ocrWordData) {
                    const boundsData = object.ocrWordData.bbox;
                    boundsData.x0 -= sourceLeft;
                    boundsData.x1 -= sourceLeft;
                    boundsData.y0 -= sourceTop;
                    boundsData.y1 -= sourceTop;
                }
                object.setCoords();
            });
            ocrObjects = ocrObjects.filter(object => !removedObjects.has(object));
            ocrWords = ocrWords.filter(word => {
                const bounds = word.bbox;
                const visible = bounds.x0 < sourceRight && bounds.x1 > sourceLeft && bounds.y0 < sourceBottom && bounds.y1 > sourceTop;
                if (!visible) return false;
                bounds.x0 = Math.max(0, bounds.x0 - sourceLeft);
                bounds.x1 = Math.min(croppedWidth, bounds.x1 - sourceLeft);
                bounds.y0 = Math.max(0, bounds.y0 - sourceTop);
                bounds.y1 = Math.min(croppedHeight, bounds.y1 - sourceTop);
                return true;
            });

            currentImageData = croppedImageData;
            imageScale = scaleX;
            ocrSourceCanvas = cropCanvas;
            ocrSourceContext = cropCanvas.getContext('2d', { willReadFrequently: true });
            canvas.setWidth(nextWidth);
            canvas.setHeight(nextHeight);
            await new Promise(resolve => fabric.Image.fromURL(croppedImageData, image => {
                canvas.setBackgroundImage(image, () => {
                    canvas.renderAll();
                    resolve();
                }, { scaleX, scaleY, left: 0, top: 0 });
            }));
            isRestoringCanvas = false;
            fitCanvasToWorkspace();
            updateEmptyState();
            saveActivePage();
            storeCanvasHistoryState();
            updateCropButtonState();
        }

        function setupRectangleDrawing() {
            canvas.on('mouse:down', event => {
                const page = pages[activePageIndex];
                if ((!isRectMaskMode && (!page?.rectangleMode || event.target)) || canvas.isDrawingMode || (event.e.button !== undefined && event.e.button !== 0)) return;

                const start = { x: event.pointer.x, y: event.pointer.y };
                const rectangle = new fabric.Rect({
                    left: start.x,
                    top: start.y,
                    width: 1,
                    height: 1,
                    fill: 'rgba(8, 127, 114, 0.07)',
                    stroke: document.getElementById('brushColor').value,
                    strokeWidth: 1.5,
                    strokeDashArray: [7, 4],
                    strokeUniform: true,
                    selectable: false,
                    evented: false,
                    objectCaching: false
                });
                rectangleInProgress = { start, rectangle };
                isRestoringCanvas = true;
                canvas.add(rectangle);
                isRestoringCanvas = false;
                event.e.preventDefault();
            });

            canvas.on('mouse:move', event => {
                if (!rectangleInProgress) return;
                const { start, rectangle } = rectangleInProgress;
                const current = event.pointer;
                rectangle.set({
                    left: Math.min(start.x, current.x),
                    top: Math.min(start.y, current.y),
                    width: Math.max(1, Math.abs(current.x - start.x)),
                    height: Math.max(1, Math.abs(current.y - start.y))
                });
                rectangle.setCoords();
                canvas.requestRenderAll();
            });

            canvas.on('mouse:up', async () => {
                if (!rectangleInProgress) return;
                const rectangle = rectangleInProgress.rectangle;
                rectangleInProgress = null;
                if (rectangle.width < 4 || rectangle.height < 4) {
                    isRestoringCanvas = true;
                    canvas.remove(rectangle);
                    isRestoringCanvas = false;
                } else if (isRectMaskMode) {
                    const color = document.getElementById('brushColor').value;
                    const erasedFromImage = await eraseImageRectangle(rectangle);
                    if (erasedFromImage) {
                        isRestoringCanvas = true;
                        canvas.remove(rectangle);
                        isRestoringCanvas = false;
                    } else {
                        rectangle.set({ fill: color, stroke: color, strokeWidth: 0, strokeDashArray: null });
                    }
                } else {
                    rectangle.set({ strokeDashArray: null });
                }
                canvas.requestRenderAll();
                storeCanvasHistoryState();
            });
        }

        async function eraseImageRectangle(rectangle) {
            const background = canvas.backgroundImage;
            const sourceElement = ocrSourceCanvas || background?.getElement();
            if (!sourceElement || !currentImageData) return false;

            const sourceCanvas = document.createElement('canvas');
            sourceCanvas.width = sourceElement.naturalWidth || sourceElement.width;
            sourceCanvas.height = sourceElement.naturalHeight || sourceElement.height;
            const sourceContext = sourceCanvas.getContext('2d', { willReadFrequently: true });
            sourceContext.drawImage(sourceElement, 0, 0);

            const scaleX = background?.scaleX || 1;
            const scaleY = background?.scaleY || 1;
            const left = Math.max(0, (rectangle.left - (background?.left || 0)) / scaleX);
            const top = Math.max(0, (rectangle.top - (background?.top || 0)) / scaleY);
            const right = Math.min(sourceCanvas.width, (rectangle.left + rectangle.width - (background?.left || 0)) / scaleX);
            const bottom = Math.min(sourceCanvas.height, (rectangle.top + rectangle.height - (background?.top || 0)) / scaleY);
            if (right - left < 2 || bottom - top < 2) return false;

            removePrintedText(sourceContext, { x0: left, y0: top, x1: right, y1: bottom });
            currentImageData = sourceCanvas.toDataURL('image/png');
            ocrSourceCanvas = sourceCanvas;
            ocrSourceContext = sourceContext;

            const overlapsRegion = bounds => bounds.x0 < right && bounds.x1 > left && bounds.y0 < bottom && bounds.y1 > top;
            ocrWords = ocrWords.filter(word => !overlapsRegion(word.bbox));
            ocrObjects = ocrObjects.filter(object => {
                const overlaps = object.ocrWordData && overlapsRegion(object.ocrWordData.bbox);
                if (overlaps) canvas.remove(object);
                return !overlaps;
            });

            await new Promise(resolve => fabric.Image.fromURL(currentImageData, image => {
                if (!image) {
                    resolve();
                    return;
                }
                canvas.setBackgroundImage(image, () => {
                    canvas.renderAll();
                    resolve();
                }, { scaleX: scaleX, scaleY: scaleY, left: background?.left || 0, top: background?.top || 0 });
            }));
            return true;
        }

        async function loadPdfFile(file) {
            const status = document.getElementById('ocrStatus');
            status.textContent = translations[isArabic ? 'ar' : 'en'].pdfLoading;
            try {
                pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
                const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
                const importedPages = [];
                for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
                    const pdfPage = await pdf.getPage(pageNumber);
                    const viewport = pdfPage.getViewport({ scale: 2 });
                    const sourceCanvas = document.createElement('canvas');
                    sourceCanvas.width = Math.ceil(viewport.width);
                    sourceCanvas.height = Math.ceil(viewport.height);
                    await pdfPage.render({
                        canvasContext: sourceCanvas.getContext('2d'),
                        viewport
                    }).promise;
                    importedPages.push({
                        imageData: sourceCanvas.toDataURL('image/png'),
                        width: sourceCanvas.width,
                        height: sourceCanvas.height
                    });
                }

                if (isCropMode) cancelCropMode();
                pages = [];
                activePageIndex = 0;
                ocrWords = [];
                ocrObjects = [];
                ocrSourceCanvas = null;
                ocrSourceContext = null;
                currentImageData = null;
                isRestoringCanvas = true;
                canvas.isDrawingMode = false;

                for (const importedPage of importedPages) {
                    canvas.clear();
                    canvas.setWidth(importedPage.width);
                    canvas.setHeight(importedPage.height);
                    await new Promise((resolve, reject) => {
                        fabric.Image.fromURL(importedPage.imageData, image => {
                            if (!image) {
                                reject(new Error('PDF page image could not be loaded'));
                                return;
                            }
                            canvas.setBackgroundImage(image, () => {
                                const page = {
                                    json: canvas.toJSON(['isOcrText', 'ocrCommitted', 'ocrWordData']),
                                    width: importedPage.width,
                                    height: importedPage.height,
                                    imageData: importedPage.imageData,
                                    imageScale: 1,
                                    ocrWords: [],
                                    ocrSourceData: importedPage.imageData,
                                    rectangleMode: false,
                                    drawingMode: false
                                };
                                pages.push(page);
                                resolve();
                            });
                        });
                    });
                }
                isRestoringCanvas = false;
                restorePageAtIndex(0);
                status.textContent = '';
            } catch (error) {
                isRestoringCanvas = false;
                status.textContent = translations[isArabic ? 'ar' : 'en'].pdfError;
                console.error('PDF import failed:', error);
            }
        }

        function loadTesseract() {

        async function loadTesseractWorker() {
            if (!tesseractWorkerPromise) {
                tesseractWorkerPromise = (async () => {
                    const tesseract = await loadTesseract();
                    const worker = await tesseract.createWorker('ara+eng', tesseract.OEM?.LSTM_ONLY ?? 1, {
                        logger: progress => {
                            if (progress.status === 'recognizing text') {
                                const status = document.getElementById('ocrStatus');
                                const lang = isArabic ? 'ar' : 'en';
                                status.textContent = `${translations[lang].ocrProgress}${Math.round(progress.progress * 100)}%`;
