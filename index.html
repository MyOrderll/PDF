                    });
                    await worker.setParameters({
                        tessedit_pageseg_mode: tesseract.PSM?.AUTO ?? 3,
                        preserve_interword_spaces: '1'
                    });
                    return worker;
                })().catch(error => {
                    tesseractWorkerPromise = null;
                    throw error;
                });
            }
            return tesseractWorkerPromise;
        }

        async function prepareOcrImage(imageData) {
            const image = new Image();
            image.src = imageData;
            await image.decode();

            const sourceWidth = image.naturalWidth;
            const sourceHeight = image.naturalHeight;
            const longestSide = Math.max(sourceWidth, sourceHeight);
            const scale = Math.min(2.6, 3200 / longestSide, Math.sqrt(8000000 / (sourceWidth * sourceHeight)));
            const width = Math.max(1, Math.round(sourceWidth * scale));
            const height = Math.max(1, Math.round(sourceHeight * scale));
            const ocrCanvas = document.createElement('canvas');
            ocrCanvas.width = width;
            ocrCanvas.height = height;
            const context = ocrCanvas.getContext('2d', { alpha: false });
            context.fillStyle = '#ffffff';
            context.fillRect(0, 0, width, height);
            context.imageSmoothingEnabled = true;
            context.imageSmoothingQuality = 'high';
            context.filter = 'grayscale(1) contrast(1.15)';
            context.drawImage(image, 0, 0, width, height);
            return { imageData: ocrCanvas.toDataURL('image/png'), scale };
        }

        function sampleImageColor(context, x0, y0, x1, y1, sampleInside, backgroundColor) {
            const padding = 3;
            const bounds = context.canvas;
            const left = Math.max(0, Math.floor(x0 - padding));
            const top = Math.max(0, Math.floor(y0 - padding));
            const right = Math.min(bounds.width, Math.ceil(x1 + padding));
            const bottom = Math.min(bounds.height, Math.ceil(y1 + padding));
            const pixels = context.getImageData(left, top, right - left, bottom - top).data;
            const color = backgroundColor ? backgroundColor.match(/\d+/g).map(Number) : null;
            const channels = [[], [], []];

            for (let y = top; y < bottom; y += 2) {
                for (let x = left; x < right; x += 2) {
                    const isInside = x >= x0 && x <= x1 && y >= y0 && y <= y1;
                    if (isInside !== sampleInside) continue;
                    const index = ((y - top) * (right - left) + x - left) * 4;
                    const pixel = [pixels[index], pixels[index + 1], pixels[index + 2]];
                    if (sampleInside && color) {
                        const contrast = Math.abs(pixel[0] - color[0]) + Math.abs(pixel[1] - color[1]) + Math.abs(pixel[2] - color[2]);
                        if (contrast < 90) continue;
                    }
                    channels.forEach((values, channel) => values.push(pixel[channel]));
                }
            }

            if (!channels[0].length) return sampleInside ? '#111111' : '#ffffff';
            const median = channels.map(values => {
                values.sort((first, second) => first - second);
                return values[Math.floor(values.length / 2)];
            });
            return `rgb(${median[0]}, ${median[1]}, ${median[2]})`;
        }

        function estimateTextStyle(context, x0, y0, x1, y1, backgroundColor) {
            const background = backgroundColor.match(/\d+/g).map(Number);
            const left = Math.max(0, Math.floor(x0));
            const top = Math.max(0, Math.floor(y0));
            const right = Math.min(context.canvas.width, Math.ceil(x1));
            const bottom = Math.min(context.canvas.height, Math.ceil(y1));
            const pixels = context.getImageData(left, top, right - left, bottom - top).data;
            let inkPixels = 0;
            let totalPixels = 0;
            let inkTop = bottom;
            let inkBottom = top;
            const colorBuckets = new Map();

            for (let index = 0; index < pixels.length; index += 4) {
                const contrast = Math.abs(pixels[index] - background[0]) +
                    Math.abs(pixels[index + 1] - background[1]) +
                    Math.abs(pixels[index + 2] - background[2]);
                const pixelY = top + Math.floor(index / 4 / (right - left));
                if (contrast > 90) {
                    inkPixels++;
                    inkTop = Math.min(inkTop, pixelY);
                    inkBottom = Math.max(inkBottom, pixelY);
                }
                if (contrast > 150) {
                    const red = pixels[index];
                    const green = pixels[index + 1];
                    const blue = pixels[index + 2];
                    const key = `${red >> 4},${green >> 4},${blue >> 4}`;
                    const bucket = colorBuckets.get(key) || { red: 0, green: 0, blue: 0, count: 0 };
                    bucket.red += red;
                    bucket.green += green;
                    bucket.blue += blue;
                    bucket.count++;
                    colorBuckets.set(key, bucket);
                }
                totalPixels++;
            }

            const dominantColor = [...colorBuckets.values()].sort((first, second) => second.count - first.count)[0];
            const textColor = dominantColor
                ? `rgb(${Math.round(dominantColor.red / dominantColor.count)}, ${Math.round(dominantColor.green / dominantColor.count)}, ${Math.round(dominantColor.blue / dominantColor.count)})`
                : '#111111';

            return {
                textColor,
                fontWeight: inkPixels / Math.max(totalPixels, 1) > 0.18 ? 'bold' : 'normal',
                inkHeight: inkBottom >= inkTop ? inkBottom - inkTop + 1 : bottom - top
            };
        }

        function estimateFontSize(text, fontWeight, targetHeight, maxWidth) {
            const measureContext = document.createElement('canvas').getContext('2d');
            measureContext.font = `${fontWeight} 100px Arial`;
            const metrics = measureContext.measureText(text);
            const glyphHeight = metrics.actualBoundingBoxAscent + metrics.actualBoundingBoxDescent;
            const heightSize = glyphHeight > 0 ? targetHeight * 100 / glyphHeight : targetHeight * 1.2;
            const widthSize = metrics.width > 0 ? maxWidth * 100 / metrics.width : heightSize;
            return Math.max(4, Math.min(heightSize, widthSize));
        }

        function findOcrWordIndex(pointer) {
            let nearestIndex = -1;
            let nearestDistance = Infinity;

            for (let index = 0; index < ocrWords.length; index++) {
                const bounds = ocrWords[index].bbox;
                const left = bounds.x0 * imageScale;
                const top = bounds.y0 * imageScale;
                const right = bounds.x1 * imageScale;
                const bottom = bounds.y1 * imageScale;
                const distanceX = Math.max(left - pointer.x, 0, pointer.x - right);
                const distanceY = Math.max(top - pointer.y, 0, pointer.y - bottom);
                if (distanceX === 0 && distanceY === 0) return index;

                const distance = Math.hypot(distanceX, distanceY);
                const hitPadding = Math.max(8, (bounds.y1 - bounds.y0) * 0.32) * imageScale;
                if (distance <= hitPadding && distance < nearestDistance) {
                    nearestIndex = index;
                    nearestDistance = distance;
                }
            }

            return nearestIndex;
        }

        function commitOcrText(textObject) {
            if (!textObject.isOcrText || textObject.ocrCommitted) return;

            removePrintedText(ocrSourceContext, textObject.ocrWordData.bbox);
            currentImageData = ocrSourceCanvas.toDataURL('image/png');
            textObject.set({ fill: textObject.ocrWordData.textColor });
            textObject.ocrCommitted = true;

            const restoredImage = new Image();
            restoredImage.onload = () => {
                const background = new fabric.Image(restoredImage);
                canvas.setBackgroundImage(background, () => {
                    canvas.renderAll();
                    scheduleCanvasHistoryCapture();
                }, {
                    scaleX: imageScale,
                    scaleY: imageScale
                });
            };
            restoredImage.src = currentImageData;
        }

        function removePrintedText(context, bounds) {
            const horizontalPadding = 3;
            const verticalPadding = 2;
            const left = Math.max(0, Math.floor(bounds.x0) - horizontalPadding);
            const right = Math.min(context.canvas.width - 1, Math.ceil(bounds.x1) + horizontalPadding);
            const top = Math.max(0, Math.floor(bounds.y0) - verticalPadding);
            const bottom = Math.min(context.canvas.height, Math.ceil(bounds.y1) + verticalPadding);
            const width = right - left + 1;
            const sampleTop = Math.max(0, top - verticalPadding);
            const sampleBottom = Math.min(context.canvas.height - 1, bottom + verticalPadding);
            const topPixels = context.getImageData(left, sampleTop, width, 1).data;
            const bottomPixels = context.getImageData(left, sampleBottom, width, 1).data;

            for (let y = top; y < bottom; y++) {
                const row = context.createImageData(width, 1);
                const ratio = (y - sampleTop) / Math.max(sampleBottom - sampleTop, 1);
                for (let x = 0; x < width; x++) {
                    const index = x * 4;
                    row.data[index] = Math.round(topPixels[index] + (bottomPixels[index] - topPixels[index]) * ratio);
                    row.data[index + 1] = Math.round(topPixels[index + 1] + (bottomPixels[index + 1] - topPixels[index + 1]) * ratio);
                    row.data[index + 2] = Math.round(topPixels[index + 2] + (bottomPixels[index + 2] - topPixels[index + 2]) * ratio);
                    row.data[index + 3] = 255;
                }

                context.putImageData(row, left, y);
            }
        }

        document.getElementById('recognizeTextBtn').addEventListener('click', async () => {
            const status = document.getElementById('ocrStatus');
            const lang = isArabic ? 'ar' : 'en';
            if (!currentImageData) {
                status.textContent = translations[lang].ocrNoImage;
                return;
            }

            const button = document.getElementById('recognizeTextBtn');
            button.disabled = true;
            status.textContent = translations[lang].ocrLoading;
            try {
                const [worker, ocrImage] = await Promise.all([
                    loadTesseractWorker(),
                    prepareOcrImage(currentImageData)
                ]);
                const result = await worker.recognize(ocrImage.imageData);
                const sourceImage = new Image();
                sourceImage.src = currentImageData;
                await sourceImage.decode();
                ocrSourceCanvas = document.createElement('canvas');
                ocrSourceCanvas.width = sourceImage.naturalWidth;
                ocrSourceCanvas.height = sourceImage.naturalHeight;
                ocrSourceContext = ocrSourceCanvas.getContext('2d', { willReadFrequently: true });
                ocrSourceContext.drawImage(sourceImage, 0, 0);

                ocrObjects.forEach(object => canvas.remove(object));
                ocrObjects = [];
                ocrWords = [];
                const words = result.data.words.filter(word => word.text.trim() && word.bbox);
                words.forEach(word => {
                    const bounds = {
                        x0: word.bbox.x0 / ocrImage.scale,
                        y0: word.bbox.y0 / ocrImage.scale,
                        x1: word.bbox.x1 / ocrImage.scale,
                        y1: word.bbox.y1 / ocrImage.scale
                    };
                    const { x0, y0, x1, y1 } = bounds;
                    const boxWidth = x1 - x0;
                    const boxHeight = y1 - y0;
                    if (boxWidth <= 0 || boxHeight <= 0) return;

                    const background = sampleImageColor(ocrSourceContext, x0, y0, x1, y1, false);
                    const textStyle = estimateTextStyle(ocrSourceContext, x0, y0, x1, y1, background);
                    ocrWords.push({ ...word, bbox: bounds, ...textStyle });
                });
                status.textContent = ocrWords.length ? translations[lang].ocrFound : translations[lang].ocrNone;
                scheduleCanvasHistoryCapture();
            } catch (error) {
                status.textContent = translations[lang].ocrError;
                console.error(error);
            } finally {
                button.disabled = false;
            }
        });

        // تشغيل وإيقاف الرسم (لعمل طمس/تحديد للنص القديم)
        const drawBtn = document.getElementById('drawBtn');
        const brushSettings = document.getElementById('brushSettings');
        drawBtn.addEventListener('click', () => {
            if (isCropMode) cancelCropMode();
            if (isRectMaskMode) {
                isRectMaskMode = false;
                canvas.skipTargetFind = false;
                canvas.selection = true;
                canvas.upperCanvasEl.style.touchAction = pages[activePageIndex]?.rectangleMode ? 'none' : 'manipulation';
                rectangleEraseBtn.classList.remove('is-active');
                rectangleEraseBtn.textContent = translations[isArabic ? 'ar' : 'en'].rectangleErase;
            }
            canvas.isDrawingMode = !canvas.isDrawingMode;
            const lang = isArabic ? 'ar' : 'en';
            
            if (canvas.isDrawingMode) {
                drawBtn.textContent = translations[lang].drawActive;
                drawBtn.classList.add('is-active');
                brushSettings.style.display = 'flex';
            } else {
                drawBtn.textContent = translations[lang].draw;
                drawBtn.classList.remove('is-active');
                brushSettings.style.display = 'none';
            }
        });

        const rectangleEraseBtn = document.getElementById('rectangleEraseBtn');
        rectangleEraseBtn.addEventListener('click', () => {
            if (isCropMode) cancelCropMode();
            isRectMaskMode = !isRectMaskMode;
            canvas.isDrawingMode = false;
            canvas.skipTargetFind = isRectMaskMode;
            canvas.selection = !isRectMaskMode;
            if (isRectMaskMode) {
                canvas.discardActiveObject();
                drawBtn.classList.remove('is-active');
                drawBtn.textContent = translations[isArabic ? 'ar' : 'en'].draw;
            }
            rectangleEraseBtn.classList.toggle('is-active', isRectMaskMode);
            rectangleEraseBtn.textContent = translations[isArabic ? 'ar' : 'en'][isRectMaskMode ? 'rectangleEraseActive' : 'rectangleErase'];
            brushSettings.style.display = isRectMaskMode ? 'flex' : 'none';
            canvas.upperCanvasEl.style.touchAction = isRectMaskMode || pages[activePageIndex]?.rectangleMode ? 'none' : 'manipulation';
            canvas.requestRenderAll();
        });

        // تغيير لون وحجم الفرشاة
        connectHexColorInput('brushColor', 'brushColorHex', color => {
            canvas.freeDrawingBrush.color = color;
        });
        document.getElementById('brushSize').addEventListener('change', function() {
            canvas.freeDrawingBrush.width = parseInt(this.value, 10);
        });

        // إضافة نص
        document.getElementById('addTextBtn').addEventListener('click', () => {
            const lang = isArabic ? 'ar' : 'en';
            const sourceText = canvas.getActiveObject();
            const hasTextStyle = sourceText instanceof fabric.IText;
            const isReplacingOcrText = hasTextStyle && sourceText.isOcrText && !sourceText.ocrCommitted && sourceText.ocrWordData;
            if (isReplacingOcrText) commitOcrText(sourceText);
            const selectedFontFamily = document.getElementById('fontFamilySelect').value;
            const textStyle = hasTextStyle ? {
                left: sourceText.left + (isReplacingOcrText ? 0 : 20),
                top: sourceText.top + (isReplacingOcrText ? 0 : 20),
                fontFamily: sourceText.fontFamily,
                fill: sourceText.fill,
                fontSize: sourceText.fontSize,
                fontWeight: sourceText.fontWeight,
                fontStyle: sourceText.fontStyle,
                underline: sourceText.underline,
                linethrough: sourceText.linethrough,
                overline: sourceText.overline,
                textAlign: sourceText.textAlign,
                lineHeight: sourceText.lineHeight,
                charSpacing: sourceText.charSpacing,
                stroke: sourceText.stroke,
                strokeWidth: sourceText.strokeWidth,
                opacity: sourceText.opacity,
                angle: sourceText.angle,
                scaleX: isReplacingOcrText ? sourceText.scaleX : 1,
                scaleY: isReplacingOcrText ? sourceText.scaleY : 1,
                isOcrText: false
            } : {
                left: 50,
                top: 50,
                fontFamily: selectedFontFamily,
                fill: '#000000',
                fontSize: 30
            };
            const textOptions = isReplacingOcrText ? { ...textStyle, width: Math.max(sourceText.width, 20) } : textStyle;
            const text = isReplacingOcrText
                ? new fabric.Textbox(translations[lang].newTextStr, textOptions)
                : new fabric.IText(translations[lang].newTextStr, textOptions);
            if (isReplacingOcrText) {
                canvas.remove(sourceText);
                ocrObjects = ocrObjects.filter(object => object !== sourceText);
            }
            canvas.add(text);
            canvas.setActiveObject(text);
            text.enterEditing();
            text.selectAll();
        });

        document.getElementById('replaceTextBtn').addEventListener('click', () => {
            const text = canvas.getActiveObject();
            if (text instanceof fabric.IText && text.isOcrText && !text.ocrCommitted && text.ocrWordData) {
                document.getElementById('addTextBtn').click();
            }
        });

        function createOcrText(word) {
            const { x0, y0, x1, y1 } = word.bbox;
            const textObject = new fabric.IText(word.text, {
                left: x0 * imageScale,
                top: y0 * imageScale,
                fontFamily: 'Arial',
                fontSize: estimateFontSize(word.text, word.fontWeight, word.inkHeight * imageScale, (x1 - x0) * imageScale),
                fontWeight: word.fontWeight,
                fill: 'rgba(0, 0, 0, 0)',
                borderColor: '#267d83',
                cornerColor: '#267d83',
                cornerStrokeColor: '#ffffff',
                transparentCorners: false,
                cornerSize: 8,
                padding: 4,
                isOcrText: true
            });
            textObject.borderColor = '#267d83';
            textObject.cornerColor = '#267d83';
            textObject.cornerStrokeColor = '#ffffff';
            textObject.ocrWordData = word;
            textObject.on('changed', () => commitOcrText(textObject));
            canvas.add(textObject);
            textObject.setCoords();
            ocrObjects.push(textObject);
            canvas.setActiveObject(textObject);
            return textObject;
        }

        function areOnSameOcrLine(firstWord, secondWord) {
            const firstHeight = firstWord.bbox.y1 - firstWord.bbox.y0;
            const secondHeight = secondWord.bbox.y1 - secondWord.bbox.y0;
            const smallerHeight = Math.min(firstHeight, secondHeight);
            const verticalOverlap = Math.max(0, Math.min(firstWord.bbox.y1, secondWord.bbox.y1) - Math.max(firstWord.bbox.y0, secondWord.bbox.y0));
            const centerDistance = Math.abs((firstWord.bbox.y0 + firstWord.bbox.y1 - secondWord.bbox.y0 - secondWord.bbox.y1) / 2);
            const sameOcrLine = firstWord.line_num != null && firstWord.line_num === secondWord.line_num &&
                ['block_num', 'par_num'].every(key => firstWord[key] == null || secondWord[key] == null || firstWord[key] === secondWord[key]);
            const sameVisualLine = verticalOverlap / smallerHeight >= 0.4 &&
                centerDistance <= Math.max(firstHeight, secondHeight) * 0.4;
            return sameOcrLine || sameVisualLine;
        }

        function selectOcrPhrase(event) {
            if (isCropMode) return;
            const activeObject = canvas.getActiveObject();
            const shouldRestoreWord = activeObject?.isOcrText && !activeObject.ocrCommitted;
            if (shouldRestoreWord && !ocrWords.includes(activeObject.ocrWordData)) {
                ocrWords.push(activeObject.ocrWordData);
            }

            canvas.calcOffset();
            const pointer = canvas.getPointer(event);
            const wordIndex = findOcrWordIndex(pointer);
            if (wordIndex === -1) return;

            const selectedWord = ocrWords[wordIndex];
            const phraseWords = ocrWords.filter(word => areOnSameOcrLine(selectedWord, word));
            if (phraseWords.length < 2) {
                if (shouldRestoreWord) {
                    ocrWords = ocrWords.filter(word => word !== activeObject.ocrWordData);
                }
                return;
            }

            if (shouldRestoreWord) {
                canvas.remove(activeObject);
                ocrObjects = ocrObjects.filter(object => object !== activeObject);
            }

            const bounds = phraseWords.reduce((combined, word) => ({
                x0: Math.min(combined.x0, word.bbox.x0),
                y0: Math.min(combined.y0, word.bbox.y0),
                x1: Math.max(combined.x1, word.bbox.x1),
                y1: Math.max(combined.y1, word.bbox.y1)
            }), { ...phraseWords[0].bbox });
            const phrase = {
                ...phraseWords[0],
                text: phraseWords.map(word => word.text).join(' '),
                bbox: bounds,
                fontWeight: phraseWords.some(word => word.fontWeight === 'bold') ? 'bold' : 'normal',
                inkHeight: Math.max(...phraseWords.map(word => word.inkHeight))
            };
            ocrWords = ocrWords.filter(word => !phraseWords.includes(word));
            createOcrText(phrase);
            editSelectedText();
        }

        // تحديد محتوى النص كاملا بالنقر أو من زر التعديل.
        function editSelectedText(event, pointerOverride) {
            if (isCropMode) return;
            if (event) canvas.calcOffset();
            let activeObject = canvas.getActiveObject();
            const target = event ? canvas.findTarget(event) : null;
            const pointer = pointerOverride || (event ? canvas.getPointer(event) : null);
            const wordIndex = pointer && !(target instanceof fabric.IText && !target.isOcrText)
                ? findOcrWordIndex(pointer)
                : -1;
            const activeOcrText = activeObject instanceof fabric.IText && activeObject.isOcrText && !activeObject.ocrCommitted;

            if (wordIndex !== -1) {
                if (activeOcrText) {
                    canvas.remove(activeObject);
                    ocrObjects = ocrObjects.filter(object => object !== activeObject);
                    if (!ocrWords.includes(activeObject.ocrWordData)) ocrWords.push(activeObject.ocrWordData);
                }
                const [word] = ocrWords.splice(wordIndex, 1);
                activeObject = createOcrText(word);
            } else {
                if (event && activeOcrText && target !== activeObject) {
                    canvas.remove(activeObject);
                    ocrObjects = ocrObjects.filter(object => object !== activeObject);
                    if (!ocrWords.includes(activeObject.ocrWordData)) ocrWords.push(activeObject.ocrWordData);
                    activeObject = null;
                }
                if (target instanceof fabric.IText) {
                    canvas.setActiveObject(target);
                    activeObject = target;
                }
            }

            if (!(activeObject instanceof fabric.IText)) {
                if (!event && !pointerOverride) {
                    isTextEditArmed = true;
                    const lang = isArabic ? 'ar' : 'en';
                    document.getElementById('editTextBtn').textContent = translations[lang].editPrompt;
                    const hint = document.getElementById('editTextHint');
                    hint.textContent = translations[lang].editHint;
                    hint.classList.remove('hidden');
                }
                return;
            }

            if (isFormatPainterArmed && activeObject !== textStyleSource) {
                applyCopiedTextFormat(activeObject);
            }

            const fontSelector = document.getElementById('fontFamilySelect');
            if (![...fontSelector.options].some(option => option.value === activeObject.fontFamily)) {
                fontSelector.add(new Option(activeObject.fontFamily, activeObject.fontFamily));
            }
            fontSelector.value = activeObject.fontFamily;

            isTextEditArmed = false;
            const lang = isArabic ? 'ar' : 'en';
            document.getElementById('editTextBtn').textContent = translations[lang].editText;
            document.getElementById('editTextHint').classList.add('hidden');
            activeObject.enterEditing();
            activeObject.selectAll();
            activeObject.hiddenTextarea.focus();
            canvas.renderAll();
        }

        document.getElementById('editTextBtn').addEventListener('click', () => editSelectedText());

        document.getElementById('fontFamilySelect').addEventListener('change', event => {
            const activeObject = canvas.getActiveObject();
            if (!(activeObject instanceof fabric.IText)) {
                const lang = isArabic ? 'ar' : 'en';
                const hint = document.getElementById('editTextHint');
                hint.textContent = translations[lang].selectTextFirst;
                hint.classList.remove('hidden');
                return;
            }

            commitOcrText(activeObject);
            activeObject.set('fontFamily', event.target.value);
            activeObject.initDimensions();
            activeObject.setCoords();
            canvas.renderAll();
            scheduleCanvasHistoryCapture();
        });

        function adjustSelectedFontSize(amount) {
            const activeObject = canvas.getActiveObject();
            const lang = isArabic ? 'ar' : 'en';
            if (!(activeObject instanceof fabric.IText)) {
                const hint = document.getElementById('editTextHint');
                hint.textContent = translations[lang].selectTextFirst;
                hint.classList.remove('hidden');
                return;
            }

            commitOcrText(activeObject);
            activeObject.set('fontSize', Math.max(4, activeObject.fontSize + amount));
            activeObject.initDimensions();
            activeObject.setCoords();
            canvas.renderAll();
            scheduleCanvasHistoryCapture();
        }

        document.getElementById('increaseFontBtn').addEventListener('click', () => adjustSelectedFontSize(2));
        document.getElementById('decreaseFontBtn').addEventListener('click', () => adjustSelectedFontSize(-2));

        // تحميل الصورة
        document.getElementById('downloadBtn').addEventListener('click', () => {
            // إخفاء التحديد المربع اللي بيظهر لما تكون ماسك النص
            canvas.discardActiveObject();
            canvas.renderAll();
            
            const dataURL = canvas.toDataURL({
                format: 'png',
                quality: 1.0
            });
            
            const link = document.createElement('a');
            link.href = dataURL;
            link.download = 'edited_image.png';
            link.click();
        });

        document.getElementById('downloadPdfBtn').addEventListener('click', async () => {
            if (!pages.length || !window.jspdf?.jsPDF) return;
            saveActivePage();
            const { jsPDF } = window.jspdf;
            const firstPage = pages[0];
            const pdf = new jsPDF({
                unit: 'px',
                format: [firstPage.width, firstPage.height],
                orientation: firstPage.width > firstPage.height ? 'landscape' : 'portrait',
                compress: true
            });

            for (let index = 0; index < pages.length; index++) {
                const page = pages[index];
                if (index > 0) pdf.addPage([page.width, page.height]);
                const pageCanvasElement = document.createElement('canvas');
                const pageCanvas = new fabric.StaticCanvas(pageCanvasElement, {
                    width: page.width,
                    height: page.height,
                    enableRetinaScaling: false
                });
                await new Promise(resolve => pageCanvas.loadFromJSON(page.json, resolve));
                pageCanvas.renderAll();
                pdf.addImage(pageCanvas.toDataURL({ format: 'png' }), 'PNG', 0, 0, page.width, page.height);
                pageCanvas.dispose();
            }
            pdf.save('edited_document.pdf');
        });
    </script>
