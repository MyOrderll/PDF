<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع تعديل الصور</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700&family=Amiri:wght@400;700&family=Cairo:wght@400;700&family=Changa:wght@400;700&family=El+Messiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;700&family=Montserrat:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&family=Playfair+Display:wght@400;700&family=Roboto+Slab:wght@400;700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <!-- مكتبة Tailwind للتصميم السريع -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- مكتبة Fabric.js للتعامل مع الصور والرسم -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <style>
        :root {
            color-scheme: light;
            --page: #f1f5f3;
            --surface: #ffffff;
            --surface-muted: #f5f8f7;
            --ink: #19363a;
            --muted: #6f8382;
            --line: #d9e4e0;
            --brand: #087f72;
            --brand-hover: #06675e;
            --accent: #c56c48;
            --stage: #e9f0ed;
            --shadow: 0 14px 38px rgba(23, 51, 55, 0.09);
        }

        html.dark {
            color-scheme: dark;
            --page: #121d20;
            --surface: #1a292c;
            --surface-muted: #203236;
            --ink: #e7efed;
            --muted: #a1b1b2;
            --line: #34484b;
            --brand: #42b7a5;
            --brand-hover: #55c8b6;
            --accent: #ee9a68;
            --stage: #152326;
            --shadow: 0 14px 38px rgba(0, 0, 0, 0.2);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--page);
            color: var(--ink);
            font-family: 'Cairo', 'Tahoma', sans-serif;
            transition: background 180ms ease, color 180ms ease;
        }

        button, select, input { font: inherit; }

        .app-header {
            position: sticky;
            top: 0;
            z-index: 30;
            min-height: 72px;
            padding: 12px clamp(18px, 4vw, 56px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            background: rgba(23, 53, 58, 0.97);
            color: #f4f8f7;
            border-bottom: 2px solid #159786;
            box-shadow: 0 4px 18px rgba(20, 46, 49, 0.14);
            backdrop-filter: blur(12px);
        }

        .brand, .header-actions { display: flex; align-items: center; gap: 12px; }
        .brand-mark {
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            border-radius: 7px;
            background: #087f72;
            color: white;
            font-family: 'Cairo', sans-serif;
            font-size: 21px;
            font-weight: 700;
        }
        #titleText { margin: 0; font-size: 19px; font-weight: 700; }
        .header-actions { gap: 8px; }
        .utility-btn {
            min-height: 38px;
            padding: 7px 12px;
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 5px;
            background: transparent;
            color: #f4f8f7;
            cursor: pointer;
        }
        .utility-btn:hover { background: rgba(255, 255, 255, 0.1); }
        .history-controls {
            display: flex;
            align-items: center;
            gap: 3px;
            padding: 2px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 6px;
        }
        .history-btn {
            width: 34px;
            min-height: 34px;
            padding: 0;
            display: grid;
            place-items: center;
            border: 0;
            border-radius: 4px;
            font-family: Arial, sans-serif;
            font-size: 22px;
            line-height: 1;
        }
        .history-btn:disabled { opacity: 0.38; cursor: not-allowed; }
        .history-btn:not(:disabled):hover { background: rgba(255, 255, 255, 0.14); }
        .history-btn:focus-visible { outline: 2px solid #69d6c5; outline-offset: 2px; }
        .mode-menu { position: relative; }
        .mode-menu > summary { display: flex; align-items: center; gap: 8px; list-style: none; }
        .mode-menu > summary::-webkit-details-marker { display: none; }
        .mode-menu > summary::after { content: '▾'; font-size: 12px; }
        .mode-menu-panel {
            position: absolute;
            top: calc(100% + 8px);
            inset-inline-start: 0;
            z-index: 20;
            min-width: 190px;
            padding: 7px;
            display: grid;
            gap: 5px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 7px;
            box-shadow: var(--shadow);
        }
        .mode-menu-panel button {
            min-height: 38px;
            padding: 7px 10px;
            border: 0;
            border-radius: 4px;
            background: transparent;
            color: var(--ink);
            text-align: start;
            cursor: pointer;
        }
        .mode-menu-panel button:hover:not(:disabled) { background: var(--surface-muted); color: var(--brand); }
        .mode-menu-panel button:disabled { color: var(--muted); cursor: not-allowed; opacity: 0.6; }
        .mode-menu-panel .menu-divider { height: 1px; margin: 2px 0; background: var(--line); }
        #modeMenu .mode-menu-panel button {
            min-height: 38px;
            width: 100%;
            padding: 7px 10px;
            display: block;
            border: 0;
            border-radius: 4px;
            background: transparent;
            box-shadow: none;
            color: var(--ink);
            font-size: 13px;
            font-weight: 500;
            text-align: start;
            transform: none;
        }
        #modeMenu .mode-menu-panel button:hover:not(:disabled) { background: var(--surface-muted); color: var(--brand); box-shadow: none; }

        .editor-layout {
            width: min(100%, 1760px);
            min-height: calc(100vh - 72px);
            margin: 0 auto;
            padding: 20px clamp(14px, 2vw, 30px) 28px;
            display: grid;
            grid-template-columns: minmax(280px, 320px) minmax(0, 1fr);
            gap: 18px;
            align-items: stretch;
        }

        .tools-panel {
            position: sticky;
            top: 92px;
            max-height: calc(100vh - 112px);
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: var(--shadow);
            scrollbar-width: thin;
            scrollbar-color: #bbcfca transparent;
        }
        .panel-heading { padding-bottom: 13px; border-bottom: 1px solid var(--line); }
        .panel-eyebrow {
            display: block;
            margin-bottom: 3px;
            color: var(--brand);
            font-family: 'Montserrat', sans-serif;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            direction: ltr;
            text-align: right;
        }
        #toolsTitle { margin: 0; font-size: 19px; font-weight: 700; }
        .section-label { margin: 0; color: var(--muted); font-size: 12px; font-weight: 700; }
        .tool-divider { height: 1px; background: var(--line); }
        #addPageBtn {
            min-height: 43px;
            width: 100%;
            padding: 9px 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            border: 1px solid #c9ded9;
            border-radius: 5px;
            background: #e9f4f1;
            color: #17685f;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: background 140ms ease, transform 140ms ease;
        }
        #addPageBtn:hover { background: #dcece8; transform: translateY(-1px); }
        html.dark #addPageBtn { border-color: #456b65; background: #24413d; color: #a9e0d5; }
        html.dark #addPageBtn:hover { background: #2b4d47; }
        .upload-control, #recognizeTextBtn, #drawBtn, #rectangleEraseBtn, #addTextBtn, #editTextBtn, #replaceTextBtn,
        #increaseFontBtn, #decreaseFontBtn, #downloadBtn {
            min-height: 43px;
            width: 100%;
            padding: 9px 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            border: 1px solid transparent;
            border-radius: 5px;
            color: white;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            cursor: pointer;
            transition: background 140ms ease, transform 140ms ease, box-shadow 140ms ease;
        }
        .upload-control:hover, #recognizeTextBtn:hover, #drawBtn:hover, #rectangleEraseBtn:hover, #addTextBtn:hover,
        #editTextBtn:hover, #replaceTextBtn:hover, #increaseFontBtn:hover, #decreaseFontBtn:hover, #downloadBtn:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 12px rgba(20, 48, 50, 0.12);
        }
        .upload-control { position: relative; background: var(--brand); }
        .upload-control::before { content: '+'; font-size: 20px; font-weight: 400; line-height: 1; }
        .upload-control:hover { background: var(--brand-hover); }
        .upload-control input { display: none; }
        #recognizeTextBtn {
            min-height: 46px;
            background: #267d83;
            box-shadow: 0 3px 8px rgba(38, 125, 131, 0.16);
        }
        #recognizeTextBtn:hover { background: #206a70; box-shadow: 0 5px 12px rgba(38, 125, 131, 0.22); }
        #recognizeTextBtn:disabled { opacity: 0.65; cursor: wait; transform: none; }
        #drawBtn { background: #b46b28; }
        #drawBtn:hover { background: #96551f; }
        #drawBtn.is-active { background: #a64740; }
        #rectangleEraseBtn { background: #416f9e; }
        #rectangleEraseBtn:hover { background: #345c84; }
        #rectangleEraseBtn.is-active { background: #a64740; }
        #addTextBtn { background: #32815d; }
        #addTextBtn:hover { background: #28694b; }
        #editTextBtn { background: #416f9e; }
        #editTextBtn:hover { background: #345c84; }
        #replaceTextBtn { background: #267d83; }
        #replaceTextBtn:hover { background: #206a70; }
        #replaceTextBtn.hidden { display: none; }
        #increaseFontBtn { background: #087f72; }
        #decreaseFontBtn { background: #58777a; }
        #downloadBtn { margin-top: 3px; background: #b75a45; }
        #downloadBtn:hover { background: #984837; }
        #fontFamilyLabel, #colorLabel, #sizeLabel { color: var(--muted); font-size: 12px; font-weight: 700; }
        #fontFamilySelect {
            min-height: 42px;
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--line);
            border-radius: 5px;
            background: var(--surface-muted);
            color: var(--ink);
            outline: none;
        }
        #fontFamilySelect:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(8, 127, 114, 0.12); }

        #brushSettings { gap: 8px; }
        #brushSettings input[type="color"] { height: 38px; border: 1px solid var(--line); border-radius: 5px; }
        .hex-color-input {
            min-height: 38px;
            width: 100%;
            padding: 7px 9px;
            border: 1px solid var(--line);
            border-radius: 5px;
            background: var(--surface-muted);
            color: var(--ink);
            direction: ltr;
            text-align: left;
        }
        .hex-color-input:focus { border-color: var(--brand); outline: 2px solid rgba(8, 127, 114, 0.12); }
        #brushSettings input[type="range"] { accent-color: var(--brand); }
        #ocrStatus, #editTextHint { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.7; }
        #ocrStatus {
            padding: 10px 12px;
            border: 1px solid transparent;
            border-radius: 5px;
            background: var(--surface-muted);
        }
        #ocrStatus:not(:empty) {
            border-color: rgba(38, 125, 131, 0.18);
            border-inline-start: 3px solid var(--brand);
            color: var(--ink);
        }
        #ocrStatus:empty { display: none; }
        #recognizeTextBtn:focus-visible, .upload-control:focus-visible, #drawBtn:focus-visible, #replaceTextBtn:focus-visible,
        #rectangleEraseBtn:focus-visible, #addTextBtn:focus-visible, #editTextBtn:focus-visible {
            outline: 3px solid rgba(38, 125, 131, 0.3);
            outline-offset: 2px;
        }
        .size-controls { display: flex; gap: 8px; }
        .text-properties { display: grid; gap: 10px; padding-top: 12px; border-top: 1px solid var(--line); }
        .text-properties.hidden { display: none; }
        .text-color-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        #textColorLabel { color: var(--muted); font-size: 12px; font-weight: 700; }
        #textColorInput { width: 54px; height: 38px; padding: 3px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); cursor: pointer; }
        .text-hex-color-input { width: 104px; }
        #sampleTextColorBtn {
            min-height: 38px;
            padding: 7px 10px;
            border: 1px solid var(--line);
            border-radius: 5px;
            background: var(--surface-muted);
            color: var(--ink);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }
        #sampleTextColorBtn:hover, #sampleTextColorBtn.is-active { border-color: var(--brand); color: var(--brand); background: rgba(8, 127, 114, 0.08); }
        #textPropertyStatus { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
        #textPropertyStatus.hidden { display: none; }

        .workspace {
            min-width: 0;
            min-height: calc(100vh - 112px);
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            justify-content: flex-start;
            gap: 12px;
            overflow: auto;
            background-color: var(--stage);
            background-image: radial-gradient(rgba(72, 101, 99, 0.15) 0.7px, transparent 0.7px);
            background-size: 18px 18px;
            border: 1px solid var(--line);
            border-radius: 9px;
        }
        html.dark .workspace { background-image: radial-gradient(rgba(172, 201, 195, 0.11) 0.7px, transparent 0.7px); }
        .canvas-container { margin: 0 auto; border: 1px solid rgba(40, 65, 66, 0.2); border-radius: 3px; background: #fff; box-shadow: 0 18px 48px rgba(23, 51, 55, 0.18), 0 2px 6px rgba(23, 51, 55, 0.08); }
        .page-tabs {
            order: 2;
            min-height: 42px;
            display: flex;
            align-items: center;
            gap: 7px;
            overflow-x: auto;
            border-top: 1px solid var(--line);
        }
        .page-tab {
            min-height: 34px;
            padding: 6px 13px;
            border: 1px solid transparent;
            border-radius: 5px 5px 0 0;
            background: transparent;
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
        }
        .page-tab:hover { background: var(--surface); color: var(--ink); }
        .page-tab.is-current { border-color: var(--line); border-bottom-color: var(--surface); background: var(--surface); color: var(--brand); }
        .canvas-stage {
            position: relative;
            order: 1;
            min-width: 0;
            min-height: calc(100vh - 170px);
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto;
        }
        .empty-state {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            pointer-events: none;
            text-align: center;
        }
        .empty-state.hidden { display: none; }
        .empty-state-mark {
            width: 62px;
            height: 62px;
            display: grid;
            place-items: center;
            border: 1px solid #c9ddd7;
            border-radius: 17px;
            background: rgba(255, 255, 255, 0.82);
            color: var(--brand);
            font-family: Arial, sans-serif;
            font-size: 31px;
            box-shadow: 0 8px 22px rgba(30, 83, 75, 0.08);
        }
        .empty-state h2 { margin: 0; color: var(--ink); font-size: 20px; font-weight: 700; }
        #emptyUploadBtn {
            min-height: 42px;
            padding: 8px 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 1px solid var(--brand);
            border-radius: 5px;
            background: var(--brand);
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            pointer-events: auto;
            transition: background 140ms ease, transform 140ms ease, box-shadow 140ms ease;
        }
        #emptyUploadBtn:hover { background: var(--brand-hover); transform: translateY(-1px); box-shadow: 0 5px 14px rgba(8, 127, 114, 0.2); }
        #emptyUploadBtn:focus-visible { outline: 3px solid rgba(8, 127, 114, 0.28); outline-offset: 3px; }

        @media (max-width: 800px) {
            .app-header { min-height: 66px; padding: 10px 14px; }
            .brand-mark { width: 35px; height: 35px; }
            #titleText { font-size: 16px; }
            .utility-btn { min-height: 35px; padding: 6px 9px; font-size: 12px; }
            .history-btn { width: 32px; min-height: 32px; padding: 0; }
            .editor-layout { min-height: auto; padding: 12px; grid-template-columns: minmax(0, 1fr); gap: 14px; }
            .tools-panel { position: static; order: 1; max-height: none; padding: 17px; gap: 12px; }
            .workspace { order: 2; min-height: 58vh; padding: 10px; }
            .canvas-stage { min-height: calc(58vh - 58px); }
        }

        @media (max-width: 420px) {
            .app-header { align-items: flex-start; flex-wrap: wrap; gap: 8px; }
            .brand { gap: 8px; }
            .brand-mark { width: 32px; height: 32px; font-size: 17px; }
            #titleText { max-width: 150px; font-size: 14px; line-height: 1.5; }
            .header-actions { width: 100%; justify-content: flex-start; gap: 5px; }
            .utility-btn { padding: 5px 7px; font-size: 11px; }
            .workspace { min-height: 50vh; }
            .canvas-stage { min-height: calc(50vh - 58px); }
            .empty-state-mark { width: 54px; height: 54px; font-size: 27px; }
            .empty-state h2 { font-size: 17px; }
        }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true">م</span>
            <h1 id="titleText">محرر الصور الذكي</h1>
        </div>
        <div class="header-actions">
            <div id="historyControls" class="history-controls" role="group" aria-label="سجل التعديلات">
                <button id="undoBtn" class="utility-btn history-btn" type="button" title="تراجع (Ctrl+Z)" aria-label="تراجع (Ctrl+Z)" aria-keyshortcuts="Control+Z Meta+Z" disabled>↶</button>
                <button id="redoBtn" class="utility-btn history-btn" type="button" title="إعادة (Ctrl+Y)" aria-label="إعادة (Ctrl+Y)" aria-keyshortcuts="Control+Y Control+Shift+Z Meta+Shift+Z" disabled>↷</button>
            </div>
            <details id="modeMenu" class="mode-menu">
                <summary id="modeMenuLabel" class="utility-btn">الملفات</summary>
                <div class="mode-menu-panel">
                    <button id="imageModeBtn" type="button">تعديل الصور</button>
                    <button id="uploadImageBtn" type="button">رفع صورة</button>
                    <button id="pdfModeBtn" type="button">رفع / تعديل PDF</button>
                    <button id="recognizePdfBtn" type="button" disabled>اكتشاف نصوص وأرقام PDF</button>
                    <div class="menu-divider" aria-hidden="true"></div>
                    <button id="addPageBtn" type="button">إضافة صفحة جديدة</button>
                    <button id="downloadBtn" type="button">تنزيل الصورة</button>
                    <button id="downloadPdfBtn" type="button">تحميل PDF</button>
                </div>
            </details>
            <button id="themeBtn" class="utility-btn">🌙 Dark</button>
            <button id="langBtn" class="utility-btn">English</button>
        </div>
    </header>

    <input type="file" id="imageUpload" class="hidden" accept="image/jpeg,image/png,.jpg,.jpeg,.png">
    <input type="file" id="pdfUpload" class="hidden" accept="application/pdf,.pdf">

    <main class="editor-layout">
        <aside class="tools-panel">
            <div class="panel-heading">
                <span id="panelEyebrow" class="panel-eyebrow">IMAGE WORKSPACE</span>
                <h2 id="toolsTitle">الأدوات</h2>
            </div>
            <p id="imageSectionTitle" class="section-label">أدوات الذكاء الاصطناعي</p>
            <button id="recognizeTextBtn">اكتشاف النصوص</button>
            <p id="ocrStatus" role="status"></p>

            <div class="tool-divider"></div>

            <p id="cleanupSectionTitle" class="section-label">الطمس اليدوي</p>
            <button id="drawBtn">وضع الطمس/الرسم</button>
            <button id="rectangleEraseBtn" type="button">مسح بمستطيل</button>
            <div id="brushSettings" class="hidden flex-col gap-2">
                <label id="colorLabel" for="brushColor">لون الفرشاة:</label>
                <input type="color" id="brushColor" value="#ffffff" class="w-full">
                <label id="brushColorCodeLabel" for="brushColorHex">كود اللون:</label>
                <input type="text" id="brushColorHex" class="hex-color-input" value="#ffffff" maxlength="7" autocomplete="off" spellcheck="false" aria-label="كود لون الفرشاة">
                <label id="sizeLabel" for="brushSize">حجم الفرشاة:</label>
                <input type="range" id="brushSize" min="5" max="50" value="20" class="w-full">
            </div>

            <div class="tool-divider"></div>

            <p id="textSectionTitle" class="section-label">أدوات النص</p>
            <button id="addTextBtn">إضافة نص جديد</button>
            <button id="editTextBtn">تعديل النص</button>
            <button id="replaceTextBtn" class="hidden" type="button">استبدال النص المحدد</button>
            <div id="textProperties" class="text-properties hidden">
                <label id="fontFamilyLabel" for="fontFamilySelect">نوع الخط:</label>
                <select id="fontFamilySelect">
                    <optgroup id="arabicFontsGroup" label="خطوط عربية">
                        <option value="Arial">Arial</option>
                        <option value="Tahoma">Tahoma</option>
                        <option value="Traditional Arabic">Traditional Arabic</option>
                        <option value="Simplified Arabic">Simplified Arabic</option>
                        <option value="Cairo">Cairo</option>
                        <option value="Tajawal">Tajawal</option>
                        <option value="Amiri">Amiri</option>
                        <option value="Almarai">Almarai</option>
                        <option value="Changa">Changa</option>
                        <option value="El Messiri">El Messiri</option>
                        <option value="IBM Plex Sans Arabic">IBM Plex Sans Arabic</option>
                        <option value="Noto Naskh Arabic">Noto Naskh Arabic</option>
                    </optgroup>

        const maxHistoryStates = 30;
        let historyCaptureTimer = null;
        let isRestoringCanvas = false;

        function captureCanvasHistoryState() {
            const page = pages[activePageIndex];
            if (!page || !canvas) return null;
            return JSON.stringify({
                canvas: canvas.toJSON(['isOcrText', 'ocrCommitted', 'ocrWordData']),
                width: canvas.getWidth(),
                height: canvas.getHeight(),
                imageScale,
                ocrWords: ocrWords.map(word => ({ ...word, bbox: { ...word.bbox } })),
                rectangleMode: page.rectangleMode,
                drawingMode: canvas.isDrawingMode
            });
        }

        function updateHistoryButtons() {
            const page = pages[activePageIndex];
            const undoButton = document.getElementById('undoBtn');
            const redoButton = document.getElementById('redoBtn');
            if (!undoButton || !redoButton) return;
            undoButton.disabled = !page || page.historyIndex <= 0;
            redoButton.disabled = !page || page.historyIndex >= page.history.length - 1;
        }

        function storeCanvasHistoryState() {
            if (isRestoringCanvas) return;
            const page = pages[activePageIndex];
            const snapshot = captureCanvasHistoryState();
            if (!page || !snapshot) return;
            if (!Array.isArray(page.history)) {
                page.history = [];
                page.historyIndex = -1;
            }
            if (page.history[page.historyIndex] === snapshot) return;

            page.history.splice(page.historyIndex + 1);
            page.history.push(snapshot);
            if (page.history.length > maxHistoryStates) page.history.shift();
            page.historyIndex = page.history.length - 1;
            updateHistoryButtons();
        }

        function scheduleCanvasHistoryCapture() {
            if (isRestoringCanvas) return;
            clearTimeout(historyCaptureTimer);
            historyCaptureTimer = setTimeout(() => {
                historyCaptureTimer = null;
                storeCanvasHistoryState();
            }, 180);
        }

        function flushCanvasHistoryCapture() {
            if (historyCaptureTimer === null) return;
            clearTimeout(historyCaptureTimer);
            historyCaptureTimer = null;
            storeCanvasHistoryState();
        }

        function initializePageHistory(page) {
            if (!Array.isArray(page.history) || !Number.isInteger(page.historyIndex)) {
                page.history = [];
                page.historyIndex = -1;
            }
            if (page.historyIndex < 0) storeCanvasHistoryState();
            updateHistoryButtons();
        }

        function bindCanvasHistory() {
            ['object:added', 'object:modified', 'object:removed', 'path:created', 'text:changed'].forEach(eventName => {
                canvas.on(eventName, scheduleCanvasHistoryCapture);
            });
            document.getElementById('undoBtn').addEventListener('click', undoCanvasChange);
            document.getElementById('redoBtn').addEventListener('click', redoCanvasChange);
            document.addEventListener('keydown', handleHistoryShortcut, true);
        }

        function restoreCanvasHistoryState(snapshot) {
            const page = pages[activePageIndex];
            const state = JSON.parse(snapshot);
            page.json = state.canvas;
            page.width = state.width;
            page.height = state.height;
            page.imageData = state.canvas.backgroundImage?.src || null;
            page.imageScale = state.imageScale;
            page.ocrWords = state.ocrWords;
            page.ocrSourceData = page.imageData;
            page.rectangleMode = state.rectangleMode;
            page.drawingMode = state.drawingMode;
            restorePageAtIndex(activePageIndex);
        }

        function undoCanvasChange() {
            flushCanvasHistoryCapture();
            const page = pages[activePageIndex];
            if (!page || page.historyIndex <= 0) return;
            page.historyIndex--;
            restoreCanvasHistoryState(page.history[page.historyIndex]);
            updateHistoryButtons();
        }

        function redoCanvasChange() {
            flushCanvasHistoryCapture();
            const page = pages[activePageIndex];
            if (!page || page.historyIndex >= page.history.length - 1) return;
            page.historyIndex++;
            restoreCanvasHistoryState(page.history[page.historyIndex]);
            updateHistoryButtons();
        }

        function handleHistoryShortcut(event) {
            if (!(event.ctrlKey || event.metaKey) || event.altKey) return;
            const target = event.target;
            const isCanvasTextInput = target === canvas.getActiveObject()?.hiddenTextarea;
            if (target instanceof HTMLElement && (target.isContentEditable ||
                (/^(INPUT|SELECT|TEXTAREA)$/.test(target.tagName) && !isCanvasTextInput))) return;

            const key = event.key.toLowerCase();
            const undo = key === 'z' && !event.shiftKey;
            const redo = key === 'y' || (key === 'z' && event.shiftKey);
            if (!undo && !redo) return;
            event.preventDefault();
            event.stopPropagation();
            if (undo) undoCanvasChange();
            else redoCanvasChange();
        }

        // تهيئة اللوحة (Canvas)
        window.onload = function() {
            canvas = new fabric.Canvas('canvas', {
                width: 500,
                height: 500,
                backgroundColor: '#f3f4f6'
            });
            canvas.upperCanvasEl.addEventListener('click', event => {
                if (Date.now() - lastCanvasTouchAt < 700) {
                    lastCanvasTouchAt = 0;
                    return;
                }
                editSelectedText(event);
            });
            canvas.upperCanvasEl.addEventListener('dblclick', selectOcrPhrase);
            canvas.upperCanvasEl.addEventListener('click', sampleSelectedTextColor, true);
            canvas.upperCanvasEl.addEventListener('touchstart', event => {
                if (event.touches.length !== 1) {
                    canvasTouchStart = null;
                    return;
                }
                const touch = event.touches[0];
                canvasTouchStart = { x: touch.clientX, y: touch.clientY };
            }, { passive: true });
            canvas.upperCanvasEl.addEventListener('touchend', event => {
                const touch = event.changedTouches[0];
                const start = canvasTouchStart;
                canvasTouchStart = null;
                if (!touch || !start || canvas.isDrawingMode) return;

                const movement = Math.hypot(touch.clientX - start.x, touch.clientY - start.y);
                if (movement > 14) return;

                const bounds = canvas.upperCanvasEl.getBoundingClientRect();
                const pointer = {
                    x: (touch.clientX - bounds.left) * canvas.getWidth() / bounds.width,
                    y: (touch.clientY - bounds.top) * canvas.getHeight() / bounds.height
                };
                lastCanvasTouchAt = Date.now();
                if (isPickingTextColor) sampleSelectedTextColor(null, pointer);
                else editSelectedText(null, pointer);
                event.preventDefault();
            }, { passive: false });
            canvas.upperCanvasEl.addEventListener('touchcancel', () => {
                canvasTouchStart = null;
            }, { passive: true });
            canvas.on('selection:created', updateTextProperties);
            canvas.on('selection:updated', updateTextProperties);
            canvas.on('selection:cleared', updateTextProperties);
            canvas.on('object:added', updateEmptyState);
            canvas.on('object:removed', updateEmptyState);
            document.getElementById('emptyUploadBtn').addEventListener('click', () => {
                document.getElementById('uploadImageBtn').click();
            });
            // إعدادات الفرشاة
            canvas.freeDrawingBrush.color = document.getElementById('brushColor').value;
            canvas.freeDrawingBrush.width = parseInt(document.getElementById('brushSize').value, 10);
            pages = [{
                json: canvas.toJSON(['isOcrText', 'ocrCommitted', 'ocrWordData']),
                width: canvas.getWidth(),
                height: canvas.getHeight(),
                imageData: null,
                imageScale: 1,
                ocrWords: [],
                ocrSourceData: null,
                rectangleMode: false,
                drawingMode: false
            }];
            imageWorkspaceState = { pages, activePageIndex };
            setupRectangleDrawing();
            bindCanvasHistory();
            initializePageHistory(pages[0]);
            renderPageTabs();
            updateEmptyState();
            fitCanvasToWorkspace();
            window.addEventListener('resize', fitCanvasToWorkspace);
        };

        function fitCanvasToWorkspace() {
            if (!canvas) return;
            const workspace = canvas.wrapperEl.parentElement;
            const maxWidth = Math.max(1, workspace.clientWidth - 32);
            const maxHeight = Math.max(1, workspace.clientHeight - 24);
            const displayScale = Math.min(1, maxWidth / canvas.getWidth(), maxHeight / canvas.getHeight());
            const displayWidth = Math.round(canvas.getWidth() * displayScale);
            const displayHeight = Math.round(canvas.getHeight() * displayScale);

            canvas.wrapperEl.style.width = `${displayWidth}px`;
            canvas.wrapperEl.style.height = `${displayHeight}px`;
            [canvas.lowerCanvasEl, canvas.upperCanvasEl].forEach(element => {
                element.style.width = `${displayWidth}px`;
                element.style.height = `${displayHeight}px`;
            });
            canvas.calcOffset();
        }

        function updateEmptyState() {
            const emptyState = document.getElementById('emptyState');
            if (!emptyState || !canvas) return;
            emptyState.classList.toggle('hidden', Boolean(canvas.backgroundImage || canvas.getObjects().length));
        }

        function colorToHex(color) {
            if (typeof color !== 'string') return '#183238';
            if (color.startsWith('#')) return color.slice(0, 7);
            const channels = color.match(/\d+/g);
            if (!channels || channels.length < 3) return '#183238';
            return `#${channels.slice(0, 3).map(channel => Number(channel).toString(16).padStart(2, '0')).join('')}`;
        }

        function connectHexColorInput(colorInputId, hexInputId, onColorChange) {
            const colorInput = document.getElementById(colorInputId);
            const hexInput = document.getElementById(hexInputId);
            const isValidHex = value => /^#[0-9a-fA-F]{6}$/.test(value);

            colorInput.addEventListener('input', () => {
                hexInput.value = colorInput.value;
                onColorChange(colorInput.value);
            });
            hexInput.addEventListener('input', () => {
                const value = hexInput.value.trim();
                if (!isValidHex(value)) return;
                colorInput.value = value;
                onColorChange(value);
            });
            hexInput.addEventListener('change', () => {
                if (!isValidHex(hexInput.value.trim())) hexInput.value = colorInput.value;
            });
        }

        function updateTextProperties() {
            const properties = document.getElementById('textProperties');
            if (!properties || !canvas) return;
            const text = canvas.getActiveObject();
            const canReplaceDetectedText = text instanceof fabric.IText && text.isOcrText && !text.ocrCommitted && text.ocrWordData;
            document.getElementById('replaceTextBtn').classList.toggle('hidden', !canReplaceDetectedText);
            if (!(text instanceof fabric.IText)) {
                properties.classList.add('hidden');
                return;
            }

            properties.classList.remove('hidden');
            const fontSelector = document.getElementById('fontFamilySelect');
            if (![...fontSelector.options].some(option => option.value === text.fontFamily)) {
                fontSelector.add(new Option(text.fontFamily, text.fontFamily));
            }
            fontSelector.value = text.fontFamily;
            const fill = text.isOcrText && !text.ocrCommitted ? text.ocrWordData?.textColor : text.fill;
            const textColor = colorToHex(fill);
            document.getElementById('textColorInput').value = textColor;
            document.getElementById('textColorHex').value = textColor;
        }

        function cancelTextColorSampling() {
            isPickingTextColor = false;
            textColorTarget = null;
            document.getElementById('sampleTextColorBtn').classList.remove('is-active');
            document.getElementById('textPropertyStatus').classList.add('hidden');
        }

        function sampleSelectedTextColor(event, pointerOverride) {
            if (!isPickingTextColor || (!event && !pointerOverride)) return false;
            canvas.calcOffset();
            const text = textColorTarget;
            const background = canvas.backgroundImage;
            const sourceElement = ocrSourceCanvas || background?.getElement();
            if (!(text instanceof fabric.IText) || !sourceElement) {
                document.getElementById('textPropertyStatus').textContent = translations[isArabic ? 'ar' : 'en'].sampleColorError;
                document.getElementById('textPropertyStatus').classList.remove('hidden');
                cancelTextColorSampling();
                return false;
            }

            const pointer = pointerOverride || canvas.getPointer(event);
            const sourceX = Math.floor((pointer.x - (background?.left || 0)) / (background?.scaleX || 1));
            const sourceY = Math.floor((pointer.y - (background?.top || 0)) / (background?.scaleY || 1));
            const sourceCanvas = ocrSourceCanvas || document.createElement('canvas');
            let sourceContext = ocrSourceContext;
            if (!ocrSourceCanvas) {
                sourceCanvas.width = sourceElement.naturalWidth || sourceElement.width;
                sourceCanvas.height = sourceElement.naturalHeight || sourceElement.height;
                sourceContext = sourceCanvas.getContext('2d', { willReadFrequently: true });
                sourceContext.drawImage(sourceElement, 0, 0);
            }

            if (sourceX < 0 || sourceY < 0 || sourceX >= sourceCanvas.width || sourceY >= sourceCanvas.height) return false;
            const pixel = sourceContext.getImageData(sourceX, sourceY, 1, 1).data;
            const color = `#${[pixel[0], pixel[1], pixel[2]].map(channel => channel.toString(16).padStart(2, '0')).join('')}`;
            commitOcrText(text);
            text.set('fill', color);
            canvas.setActiveObject(text);
            text.setCoords();
            document.getElementById('textColorInput').value = color;
            document.getElementById('textColorHex').value = color;
            canvas.renderAll();
            scheduleCanvasHistoryCapture();
            cancelTextColorSampling();
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
        }

        function renderPageTabs() {
            const tabs = document.getElementById('pageTabs');
            const lang = isArabic ? 'ar' : 'en';
            tabs.setAttribute('aria-label', translations[lang].pages);
            tabs.replaceChildren();
            pages.forEach((page, index) => {
                const tab = document.createElement('button');
                tab.type = 'button';
                tab.className = `page-tab${index === activePageIndex ? ' is-current' : ''}`;
                tab.role = 'tab';
                tab.setAttribute('aria-selected', index === activePageIndex ? 'true' : 'false');
                tab.dataset.pageIndex = index;
                tab.textContent = `${translations[lang].page} ${index + 1}`;
                tabs.appendChild(tab);
            });
        }

        function saveActivePage() {
            flushCanvasHistoryCapture();
            const page = pages[activePageIndex];
            if (!page || !canvas) return;

            page.json = canvas.toJSON(['isOcrText', 'ocrCommitted', 'ocrWordData']);
            page.width = canvas.getWidth();
            page.height = canvas.getHeight();
            page.imageData = currentImageData;
            page.imageScale = imageScale;
            page.ocrWords = ocrWords.map(word => ({ ...word, bbox: { ...word.bbox } }));
            page.ocrSourceData = ocrSourceCanvas ? ocrSourceCanvas.toDataURL('image/png') : null;
            page.drawingMode = canvas.isDrawingMode;
        }

        function syncActiveWorkspaceState() {
            const state = { pages, activePageIndex };
            if (activeWorkspaceMode === 'pdf') pdfWorkspaceState = state;
            else imageWorkspaceState = state;
        }

        function restoreOcrSource(sourceData) {
            ocrSourceCanvas = null;
            ocrSourceContext = null;
            if (!sourceData) return;

            const sourceImage = new Image();
            sourceImage.onload = () => {
                ocrSourceCanvas = document.createElement('canvas');
                ocrSourceCanvas.width = sourceImage.naturalWidth;
                ocrSourceCanvas.height = sourceImage.naturalHeight;
                ocrSourceContext = ocrSourceCanvas.getContext('2d', { willReadFrequently: true });
                ocrSourceContext.drawImage(sourceImage, 0, 0);
            };
            sourceImage.src = sourceData;
        }

        function switchToPage(index) {
            if (index === activePageIndex || !pages[index]) return;
            flushCanvasHistoryCapture();
            saveActivePage();
            restorePageAtIndex(index);
            syncActiveWorkspaceState();
        }

        function restorePageAtIndex(index) {
            clearTimeout(historyCaptureTimer);
            historyCaptureTimer = null;
            isRestoringCanvas = true;
            activePageIndex = index;
            const page = pages[index];
            currentImageData = page.imageData;
            imageScale = page.imageScale;
            ocrWords = page.ocrWords.map(word => ({ ...word, bbox: { ...word.bbox } }));
            restoreOcrSource(page.ocrSourceData);
            rectangleInProgress = null;

            canvas.isDrawingMode = false;
            canvas.setWidth(page.width);
            canvas.setHeight(page.height);
            canvas.loadFromJSON(page.json, () => {
                ocrObjects = canvas.getObjects().filter(object => object.isOcrText);
                ocrObjects.forEach(object => {
                    object.on('changed', () => commitOcrText(object));
                });
                canvas.isDrawingMode = isRectMaskMode ? false : page.drawingMode;
                document.getElementById('brushSettings').style.display = (canvas.isDrawingMode || isRectMaskMode) ? 'flex' : 'none';
                document.getElementById('drawBtn').classList.toggle('is-active', canvas.isDrawingMode);

        function loadPdfJs() {
            if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
            if (pdfLibraryPromise) return pdfLibraryPromise;

            pdfLibraryPromise = new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
                script.onload = () => resolve(window.pdfjsLib);
                script.onerror = reject;
                document.head.appendChild(script);
            });
            return pdfLibraryPromise;
        }

        function loadJsPdf() {
            if (window.jspdf?.jsPDF) return Promise.resolve(window.jspdf.jsPDF);
            if (jsPdfLibraryPromise) return jsPdfLibraryPromise;

            jsPdfLibraryPromise = new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
                script.onload = () => resolve(window.jspdf?.jsPDF);
                script.onerror = reject;
                document.head.appendChild(script);
            });
            return jsPdfLibraryPromise;

        function createFabricPageState(imageData, width, height) {
            return new Promise((resolve, reject) => {
                const stagingCanvas = new fabric.StaticCanvas(null, {
                    width,
                    height,
                    backgroundColor: '#ffffff'
                });
                fabric.Image.fromURL(imageData, image => {
                    if (!image) {
                        stagingCanvas.dispose();
                        reject(new Error('Could not create the PDF page image.'));
                        return;
                    }
                    stagingCanvas.setBackgroundImage(image, () => {
                        const pageJson = stagingCanvas.toJSON(['isOcrText', 'ocrCommitted', 'ocrWordData']);
                        stagingCanvas.dispose();
                        resolve(pageJson);
                    }, { scaleX: 1, scaleY: 1 });
                });
            });
        }

        function yieldToBrowser() {
            return new Promise(resolve => setTimeout(resolve, 0));
        }

        function renderPdfPage(pdfPage, renderContext, viewport) {
            const renderTask = pdfPage.render({ canvasContext: renderContext, viewport });
            renderTask.onContinue = continueRendering => setTimeout(continueRendering, 0);
            let timeoutId;
            const timeout = new Promise((resolve, reject) => {
                timeoutId = setTimeout(() => {
                    reject(new Error('PDF_PAGE_RENDER_TIMEOUT'));
                    renderTask.cancel();
                }, 20000);
            });
            return Promise.race([renderTask.promise, timeout]).finally(() => clearTimeout(timeoutId));
        }

        function saveCurrentWorkspace() {
            saveActivePage();
            syncActiveWorkspaceState();
        }

        function switchWorkspaceMode(mode) {
            if (mode === activeWorkspaceMode) return;
            const targetState = mode === 'pdf' ? pdfWorkspaceState : imageWorkspaceState;
            if (!targetState) return;

            saveCurrentWorkspace();
            activeWorkspaceMode = mode;
            pages = targetState.pages;
            restorePageAtIndex(targetState.activePageIndex);
            document.getElementById('modeMenu').open = false;
        }

        async function importPdf(file) {
            const status = document.getElementById('ocrStatus');
            const pdfButton = document.getElementById('pdfModeBtn');
            const lang = isArabic ? 'ar' : 'en';
            pdfButton.disabled = true;
            status.textContent = translations[lang].pdfLoading;

            try {
                const pdfjs = await loadPdfJs();
                pdfjs.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
                const pdfDocument = await pdfjs.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
                const importedPages = [];
                const maxPagePixels = 3_000_000;

                for (let pageNumber = 1; pageNumber <= pdfDocument.numPages; pageNumber++) {
                    status.textContent = `${translations[lang].pdfPageProgress}${pageNumber} / ${pdfDocument.numPages}`;
                    await yieldToBrowser();
                    const pdfPage = await pdfDocument.getPage(pageNumber);
                    const sourceViewport = pdfPage.getViewport({ scale: 1 });
                    const renderScale = Math.min(2, Math.sqrt(maxPagePixels / (sourceViewport.width * sourceViewport.height)));
                    const renderViewport = pdfPage.getViewport({ scale: renderScale });
                    const renderCanvas = document.createElement('canvas');
                    renderCanvas.width = Math.ceil(renderViewport.width);
                    renderCanvas.height = Math.ceil(renderViewport.height);
                    const renderContext = renderCanvas.getContext('2d', { alpha: false });
                    await renderPdfPage(pdfPage, renderContext, renderViewport);

                    const imageData = renderCanvas.toDataURL('image/jpeg', 0.96);
                    const pageWidth = renderCanvas.width;
                    const pageHeight = renderCanvas.height;
                    const pageJson = await createFabricPageState(imageData, pageWidth, pageHeight);
                    renderCanvas.width = 0;
                    renderCanvas.height = 0;
                    pdfPage.cleanup();
                    importedPages.push({
                        json: pageJson,
                        width: pageWidth,
                        height: pageHeight,
                        imageData,
                        imageScale: 1,
                        ocrWords: [],
                        ocrSourceData: null,
                        rectangleMode: false,
                        drawingMode: false,
                        pdfWidthPoints: sourceViewport.width,
                        pdfHeightPoints: sourceViewport.height
                    });
                    await yieldToBrowser();
                }

                saveCurrentWorkspace();
                pdfWorkspaceState = { pages: importedPages, activePageIndex: 0 };
                pdfFileName = file.name.replace(/\.pdf$/i, '') || 'edited-document';
                activeWorkspaceMode = 'pdf';
                pages = pdfWorkspaceState.pages;
                status.textContent = '';
                restorePageAtIndex(0);
                document.getElementById('modeMenu').open = false;
            } catch (error) {
                status.textContent = error.message === 'PDF_PAGE_RENDER_TIMEOUT'
                    ? translations[lang].pdfRenderTimeout
                    : translations[lang].pdfLoadError;
                if (error.message !== 'PDF_PAGE_RENDER_TIMEOUT' && error.name !== 'RenderingCancelledException') {
                    console.error(error);
                }
            } finally {
                pdfButton.disabled = false;
            }
        }

        async function createPdfOutput() {
            const JsPdf = await loadJsPdf();
            if (!JsPdf) throw new Error('jsPDF did not load.');
            saveCurrentWorkspace();
            let outputPdf = null;

            for (let index = 0; index < pages.length; index++) {
                const page = pages[index];
                const stagingCanvas = new fabric.StaticCanvas(null, { width: page.width, height: page.height });
                await new Promise(resolve => stagingCanvas.loadFromJSON(page.json, resolve));
                const imageData = stagingCanvas.toDataURL({ format: 'png', multiplier: 1 });
                stagingCanvas.dispose();

                const pageWidth = page.pdfWidthPoints || page.width * 0.75;
                const pageHeight = page.pdfHeightPoints || page.height * 0.75;
                if (!outputPdf) {
                    outputPdf = new JsPdf({
                        orientation: pageWidth > pageHeight ? 'landscape' : 'portrait',
                        unit: 'pt',
                        format: [pageWidth, pageHeight],
                        compress: true
                    });
                } else {
                    outputPdf.addPage([pageWidth, pageHeight], pageWidth > pageHeight ? 'landscape' : 'portrait');
                }
                outputPdf.addImage(imageData, 'PNG', 0, 0, pageWidth, pageHeight, undefined, 'FAST');
            }

            if (!outputPdf) throw new Error('There are no pages to export.');
            return outputPdf;
        }

        function setupRectangleDrawing() {
            canvas.on('mouse:down', event => {
                const page = pages[activePageIndex];
                if ((!isRectMaskMode && (!page?.rectangleMode || event.target)) || canvas.isDrawingMode || (event.e.button !== undefined && event.e.button !== 0)) return;

                const start = { x: event.pointer.x, y: event.pointer.y };
                const rectangle = new fabric.Rect({
                    left: start.x,
                    top: start.y,
                    width: 1,
                    height: 1,
                    fill: 'rgba(8, 127, 114, 0.07)',
                    stroke: document.getElementById('brushColor').value,
                    strokeWidth: 1.5,
                    strokeDashArray: [7, 4],
                    strokeUniform: true,
                    selectable: false,
                    evented: false,
                    objectCaching: false
                });
                rectangleInProgress = { start, rectangle };
                isRestoringCanvas = true;
                canvas.add(rectangle);
                isRestoringCanvas = false;
                event.e.preventDefault();
            });

            canvas.on('mouse:move', event => {
                if (!rectangleInProgress) return;
                const { start, rectangle } = rectangleInProgress;
                const current = event.pointer;
                rectangle.set({
                    left: Math.min(start.x, current.x),
                    top: Math.min(start.y, current.y),
                    width: Math.max(1, Math.abs(current.x - start.x)),
                    height: Math.max(1, Math.abs(current.y - start.y))
                });
                rectangle.setCoords();
                canvas.requestRenderAll();
            });

            canvas.on('mouse:up', async () => {
                if (!rectangleInProgress) return;
                const rectangle = rectangleInProgress.rectangle;
                rectangleInProgress = null;
                if (rectangle.width < 4 || rectangle.height < 4) {
                    isRestoringCanvas = true;
                    canvas.remove(rectangle);
                    isRestoringCanvas = false;
                } else if (isRectMaskMode) {
                    const color = document.getElementById('brushColor').value;
                    const erasedFromImage = await eraseImageRectangle(rectangle);
                    if (erasedFromImage) {
                        isRestoringCanvas = true;
                        canvas.remove(rectangle);
                        isRestoringCanvas = false;
                    } else {
                        rectangle.set({ fill: color, stroke: color, strokeWidth: 0, strokeDashArray: null });
                    }
                } else {
                    rectangle.set({ strokeDashArray: null });
                }
                canvas.requestRenderAll();
                storeCanvasHistoryState();
            });
        }

        async function eraseImageRectangle(rectangle) {
            const background = canvas.backgroundImage;
            const sourceElement = ocrSourceCanvas || background?.getElement();
            if (!sourceElement || !currentImageData) return false;

            const sourceCanvas = document.createElement('canvas');
            sourceCanvas.width = sourceElement.naturalWidth || sourceElement.width;
            sourceCanvas.height = sourceElement.naturalHeight || sourceElement.height;
            const sourceContext = sourceCanvas.getContext('2d', { willReadFrequently: true });
            sourceContext.drawImage(sourceElement, 0, 0);

            const scaleX = background?.scaleX || 1;
            const scaleY = background?.scaleY || 1;
            const left = Math.max(0, (rectangle.left - (background?.left || 0)) / scaleX);
            const top = Math.max(0, (rectangle.top - (background?.top || 0)) / scaleY);
            const right = Math.min(sourceCanvas.width, (rectangle.left + rectangle.width - (background?.left || 0)) / scaleX);
            const bottom = Math.min(sourceCanvas.height, (rectangle.top + rectangle.height - (background?.top || 0)) / scaleY);
            if (right - left < 2 || bottom - top < 2) return false;

            removePrintedText(sourceContext, { x0: left, y0: top, x1: right, y1: bottom });
            currentImageData = sourceCanvas.toDataURL('image/png');
            ocrSourceCanvas = sourceCanvas;
            ocrSourceContext = sourceContext;

            const overlapsRegion = bounds => bounds.x0 < right && bounds.x1 > left && bounds.y0 < bottom && bounds.y1 > top;
            ocrWords = ocrWords.filter(word => !overlapsRegion(word.bbox));
            ocrObjects = ocrObjects.filter(object => {
                const overlaps = object.ocrWordData && overlapsRegion(object.ocrWordData.bbox);
                if (overlaps) canvas.remove(object);
                return !overlaps;
            });

            await new Promise(resolve => fabric.Image.fromURL(currentImageData, image => {
                if (!image) {
                    resolve();
                    return;
                }
                canvas.setBackgroundImage(image, () => {
                    canvas.renderAll();
                    resolve();
                }, { scaleX: scaleX, scaleY: scaleY, left: background?.left || 0, top: background?.top || 0 });
            }));
            return true;
        }
